baseURL = "https://billsblog.dev/"
locale = "en-AU"
title = "Bill's Blog"
theme = "PaperMod"

[markup]
  [markup.goldmark]
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true

[outputs]
  # RSS removed 2026-08-26. Hugo gives sections, taxonomies and terms an RSS
  # output by default, so dropping it from `home` alone would have left
  # /posts/index.xml, /tags/<t>/index.xml and the rest still generated and
  # still linked by PaperMod's autodiscovery <link>. All four are set here.
  # JSON stays — it is the Ctrl/Cmd+K search index, not a feed.
  home = ["HTML", "JSON"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[pagination]
  pagerSize = 100

[params]
  defaultTheme = "dark"
  ShowReadingTime = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowShareButtons = false
  ShowToc = true
  TocOpen = false
  mainSections = ["posts"]
  description = "IT student. Networking, security, Linux, and the occasional shader pack."
  comments = true
  images = ["images/og-card.jpg"]


  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/yourlocalunemployed"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/billal-r-308325242/"

  [params.homeInfoParams]
    Title = "About this blog"
    Content = "IT student running a homelab on a Debian VM behind a pfSense firewall, and using AI agents inside it as tools.\n\nClaude Code does most of the building, Codex reviews it, and a self-hosted gateway puts a range of other models behind one interface. Nothing reaches the lab without me approving the exact plan — I design it, run it, break it, and decide what ships.\n\nThis blog documents those projects — networking, security, Linux — including the parts that failed and what the fix turned out to be."

  [params.goatcounter]
    # Privacy-friendly analytics (no cookies). Set to your GoatCounter site
    # code (the "<code>" in <code>.goatcounter.com) to enable. Empty = off.
    code = "billal"

  [params.giscus]
    repo = "yourlocalunemployed/yourlocalunemployed.github.io"
    repoId = "R_kgDOTIRXSA"
    category = "Announcements"
    categoryId = "DIC_kwDOTIRXSM4DARN8"

[taxonomies]
  tag = "tags"
  series = "series"

[related]
  threshold = 80
  includeNewer = true
  toLower = false
  [[related.indices]]
    name = "tags"
    weight = 100

[menu]
  [[menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    name = "Series"
    url = "/series/"
    weight = 2
  [[menu.main]]
    name = "Projects"
    url = "/projects/"
    weight = 3
  # Lab ▾ — the homelab hub groups its three views
  [[menu.main]]
    identifier = "lab"
    name = "Lab"
    url = "/lab/"
    weight = 4
  [[menu.main]]
    name = "Overview"
    parent = "lab"
    url = "/lab/"
    weight = 1
  [[menu.main]]
    name = "Network"
    parent = "lab"
