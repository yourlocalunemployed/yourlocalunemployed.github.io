{{- $gc := site.Params.goatcounter.code }}
{{- $gcScript := cond (ne $gc "") " https://gc.zgo.at" "" }}
{{- $gcConnect := cond (ne $gc "") " https://*.goatcounter.com" "" }}
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://giscus.app{{ $gcScript }}; style-src 'self' 'unsafe-inline' https://giscus.app; font-src 'self'; img-src 'self' data: https://avatars.githubusercontent.com{{ $gcConnect }}; connect-src 'self' https://giscus.app{{ $gcConnect }}; frame-src https://giscus.app; base-uri 'self'; form-action 'self';">
<meta name="referrer" content="strict-origin-when-cross-origin">
{{- if ne $gc "" }}
{{- /* Privacy-friendly analytics (GoatCounter): no cookies, no cross-site tracking. */}}
<script data-goatcounter="https://{{ $gc }}.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
{{- end }}
<style>
  body { background: transparent !important; }
  /* The bar itself is a static element from extend_footer.html; its width is
     driven by a CSS scroll timeline in custom.css (no script), with a fallback
     in effects.js for browsers without scroll-driven animations. This used to
     be an inline script here, which was one of the hash-locked ones. */
  #reading-progress {
    position: fixed;
    top: 0;
    left: 0;
    height: 3px;
    width: 0%;
    background: var(--accent, #E81A1A);
    z-index: 9999;
    pointer-events: none;
  }
</style>
