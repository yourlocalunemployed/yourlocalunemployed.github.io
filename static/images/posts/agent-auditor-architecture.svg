<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="560" fill="#1d1e20"/>
  <text x="36" y="40" fill="#e8e8e8" font-size="16" font-weight="600">Evidence the agent doesn&#8217;t control &#183; and reviewers that can escalate but never approve</text>

  <!-- Claude Code session -->
  <rect x="32" y="76" width="172" height="224" rx="10" fill="#26272a" stroke="#3a3b3e" stroke-width="1.4"/>
  <text x="118" y="112" text-anchor="middle" fill="#e8e8e8" font-size="15" font-weight="600">Claude Code</text>
  <text x="118" y="132" text-anchor="middle" fill="#9aa0a6" font-size="11.5">the audited agent</text>
  <rect x="48" y="152" width="140" height="30" rx="15" fill="#212225" stroke="#3a3b3e" stroke-width="1"/>
  <text x="118" y="172" text-anchor="middle" fill="#c9ccd1" font-size="11.5">tool calls</text>
  <rect x="48" y="192" width="140" height="30" rx="15" fill="#212225" stroke="#3a3b3e" stroke-width="1"/>
  <text x="118" y="212" text-anchor="middle" fill="#c9ccd1" font-size="11.5">session lifecycle</text>
  <text x="118" y="252" text-anchor="middle" fill="#9aa0a6" font-size="11">runs as my login user</text>
  <text x="118" y="270" text-anchor="middle" fill="#9aa0a6" font-size="11">&#8212; the residual risk</text>

  <line x1="204" y1="188" x2="234" y2="188" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- Collection -->
  <rect x="240" y="76" width="196" height="224" rx="10" fill="#26272a" stroke="#3a3b3e" stroke-width="1.4"/>
  <text x="338" y="100" text-anchor="middle" fill="#9aa0a6" font-size="11" letter-spacing="0.6">COLLECTION</text>

  <rect x="254" y="112" width="168" height="86" rx="9" fill="#212225" stroke="#3a3b3e" stroke-width="1"/>
  <text x="338" y="134" text-anchor="middle" fill="#e8e8e8" font-size="13.5" font-weight="600">Managed hooks</text>
  <text x="338" y="153" text-anchor="middle" fill="#9aa0a6" font-size="11">root-owned, outrank</text>
  <text x="338" y="168" text-anchor="middle" fill="#9aa0a6" font-size="11">user + project settings</text>
  <text x="338" y="188" text-anchor="middle" fill="#c9ccd1" font-size="11">hash commands, keep binaries</text>

  <rect x="254" y="208" width="168" height="78" rx="9" fill="#212225" stroke="#3a3b3e" stroke-width="1"/>
  <text x="338" y="230" text-anchor="middle" fill="#e8e8e8" font-size="13.5" font-weight="600">OTel collector</text>
  <text x="338" y="249" text-anchor="middle" fill="#9aa0a6" font-size="11">pinned 0.157.0</text>
  <text x="338" y="269" text-anchor="middle" fill="#c9ccd1" font-size="11">strips identity + prompts</text>

  <line x1="436" y1="188" x2="466" y2="188" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- Auditor service (the star) -->
  <rect x="472" y="76" width="214" height="224" rx="10" fill="#2a2224" stroke="#E81A1A" stroke-width="1.6"/>
  <text x="579" y="104" text-anchor="middle" fill="#e8e8e8" font-size="15" font-weight="600">agent-auditor</text>
  <text x="579" y="123" text-anchor="middle" fill="#E81A1A" font-size="11">own user &#183; loopback only</text>
  <text x="579" y="139" text-anchor="middle" fill="#9aa0a6" font-size="11">no Docker socket, no sudo</text>

  <rect x="488" y="152" width="182" height="62" rx="9" fill="#241f21" stroke="#6e3b3b" stroke-width="1"/>
  <text x="579" y="174" text-anchor="middle" fill="#e8e8e8" font-size="13" font-weight="600">hash-chained JSONL</text>
  <text x="579" y="192" text-anchor="middle" fill="#d9b3b3" font-size="11">0640 &#183; canonical, append-only</text>
  <text x="579" y="206" text-anchor="middle" fill="#9aa0a6" font-size="10.5">every record hashes the one before</text>

  <rect x="488" y="224" width="182" height="58" rx="9" fill="#241f21" stroke="#6e3b3b" stroke-width="1"/>
  <text x="579" y="246" text-anchor="middle" fill="#e8e8e8" font-size="13" font-weight="600">SQLite index</text>
  <text x="579" y="264" text-anchor="middle" fill="#9aa0a6" font-size="11">fast queries, rebuilt from JSONL</text>
  <text x="579" y="277" text-anchor="middle" fill="#9aa0a6" font-size="10.5">never the other way round</text>

  <line x1="686" y1="188" x2="716" y2="188" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- Outputs -->
  <rect x="722" y="76" width="206" height="66" rx="10" fill="#26272a" stroke="#3a3b3e" stroke-width="1.4"/>
  <text x="825" y="100" text-anchor="middle" fill="#e8e8e8" font-size="13.5" font-weight="600">Promtail &#8594; Loki</text>
  <text x="825" y="118" text-anchor="middle" fill="#9aa0a6" font-size="11">0644 reduced projection</text>
  <text x="825" y="133" text-anchor="middle" fill="#9aa0a6" font-size="10.5">no prompts, paths or raw IDs</text>

  <rect x="722" y="155" width="206" height="62" rx="10" fill="#26272a" stroke="#3a3b3e" stroke-width="1.4"/>
  <text x="825" y="178" text-anchor="middle" fill="#e8e8e8" font-size="13.5" font-weight="600">Alertmanager &#8594; ntfy</text>
  <text x="825" y="196" text-anchor="middle" fill="#9aa0a6" font-size="11">critical risk, policy violations</text>
  <text x="825" y="210" text-anchor="middle" fill="#9aa0a6" font-size="10.5">straight to my phone</text>

  <rect x="722" y="230" width="206" height="70" rx="10" fill="#26272a" stroke="#3a3b3e" stroke-width="1.4"/>
  <text x="825" y="254" text-anchor="middle" fill="#e8e8e8" font-size="13.5" font-weight="600">Operator dashboard</text>
  <text x="825" y="272" text-anchor="middle" fill="#9aa0a6" font-size="11">127.0.0.1:8765, read-only</text>
  <text x="825" y="288" text-anchor="middle" fill="#9aa0a6" font-size="10.5">plain language, no LogQL needed</text>

  <!-- drop into the review tier -->
  <path d="M579,300 L579,344" fill="none" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="592" y="326" fill="#9aa0a6" font-size="10.5">on SessionEnd</text>

  <!-- Review tier — built, not enabled -->
  <rect x="240" y="350" width="688" height="122" rx="10" fill="#212225" stroke="#4a4b4f" stroke-width="1.3" stroke-dasharray="7 5"/>
  <text x="256" y="374" fill="#9aa0a6" font-size="11.5">REVIEW TIER &#183; built and tested, switched off for the observe-only pilot</text>

  <rect x="258" y="388" width="192" height="66" rx="9" fill="#26272a" stroke="#3a3b3e" stroke-width="1"/>
  <text x="354" y="411" text-anchor="middle" fill="#e8e8e8" font-size="13" font-weight="600">LiteLLM triage</text>
  <text x="354" y="429" text-anchor="middle" fill="#9aa0a6" font-size="11">every completed session</text>
  <text x="354" y="444" text-anchor="middle" fill="#9aa0a6" font-size="10.5">capped key, cheap model</text>

  <line x1="452" y1="421" x2="478" y2="421" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect x="480" y="388" width="192" height="66" rx="9" fill="#26272a" stroke="#3a3b3e" stroke-width="1"/>
  <text x="576" y="411" text-anchor="middle" fill="#e8e8e8" font-size="13" font-weight="600">Codex escalation</text>
  <text x="576" y="429" text-anchor="middle" fill="#9aa0a6" font-size="11">risk, failure, missing evidence</text>
  <text x="576" y="444" text-anchor="middle" fill="#9aa0a6" font-size="10.5">+ a reproducible 10% of passes</text>

  <line x1="674" y1="421" x2="700" y2="421" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect x="702" y="388" width="208" height="66" rx="9" fill="#26272a" stroke="#3a3b3e" stroke-width="1"/>
  <text x="806" y="411" text-anchor="middle" fill="#e8e8e8" font-size="13" font-weight="600">Langfuse</text>
  <text x="806" y="429" text-anchor="middle" fill="#9aa0a6" font-size="11">5 session-level scores</text>
  <text x="806" y="444" text-anchor="middle" fill="#9aa0a6" font-size="10.5">compliance, evidence, risk&#8230;</text>

  <!-- authority note -->
  <rect x="32" y="350" width="172" height="122" rx="10" fill="#2a2224" stroke="#6e3b3b" stroke-width="1.3"/>
  <text x="118" y="378" text-anchor="middle" fill="#e8e8e8" font-size="13" font-weight="600">Authority</text>
  <text x="118" y="400" text-anchor="middle" fill="#d9b3b3" font-size="11">stays with me</text>
  <text x="118" y="424" text-anchor="middle" fill="#9aa0a6" font-size="10.5">deterministic rules ask</text>
  <text x="118" y="439" text-anchor="middle" fill="#9aa0a6" font-size="10.5">or deny &#8212; models only</text>
  <text x="118" y="454" text-anchor="middle" fill="#9aa0a6" font-size="10.5">raise scrutiny</text>

  <text x="36" y="506" fill="#c9ccd1" font-size="12">Verdicts: PASS &#183; NEEDS_REVIEW &#183; POLICY_VIOLATION &#183; INCOMPLETE &#183; UNVERIFIABLE</text>
  <text x="36" y="526" fill="#9aa0a6" font-size="11.5">There is deliberately no APPROVE. A reviewer can raise the level of scrutiny; it cannot authorise an action, clear a block, or override policy.</text>
  <text x="36" y="546" fill="#9aa0a6" font-size="11.5">Observe mode records every decision and changes nothing about Claude&#8217;s tool flow. Enforcement waits on calibration against human labels.</text>
</svg>
