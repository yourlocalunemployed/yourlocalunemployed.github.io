<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8a8a8a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="620" fill="#1d1e20"/>

  <text x="40" y="34" fill="#9aa0a6" font-size="14" letter-spacing="1.5" font-weight="600">ONE REQUEST, THREE AGENTS, ONE HUMAN GATE</text>

  <!-- request -->
  <rect x="40" y="52" width="860" height="44" rx="8" fill="#26272a" stroke="#3a3b3e" stroke-width="1.5"/>
  <text x="470" y="79" text-anchor="middle" fill="#e8e8e8" font-size="14">one bounded, redacted context pack &#8212; <tspan fill="#9aa0a6">identical for every agent, so disagreement means real disagreement</tspan></text>

  <line x1="470" y1="98" x2="470" y2="120" stroke="#8a8a8a" stroke-width="2" marker-end="url(#a)"/>

  <!-- round 1 -->
  <text x="40" y="140" fill="#6fae6f" font-size="12" letter-spacing="1.2" font-weight="700">ROUND 1 &#183; BLIND</text>
  <rect x="40" y="150" width="272" height="74" rx="8" fill="#26272a" stroke="#3a3b3e" stroke-width="1.5"/>
  <text x="176" y="176" text-anchor="middle" fill="#e8e8e8" font-size="14" font-weight="600">&#129302; Claude</text>
  <text x="176" y="196" text-anchor="middle" fill="#9aa0a6" font-size="11.5">operational plan</text>
  <text x="176" y="213" text-anchor="middle" fill="#9aa0a6" font-size="11">coordinator &#183; the only operator</text>

  <rect x="334" y="150" width="272" height="74" rx="8" fill="#26272a" stroke="#3a3b3e" stroke-width="1.5"/>
  <text x="470" y="176" text-anchor="middle" fill="#e8e8e8" font-size="14" font-weight="600">&#9881; Codex</text>
  <text x="470" y="196" text-anchor="middle" fill="#9aa0a6" font-size="11.5">implementation + test plan</text>
  <text x="470" y="213" text-anchor="middle" fill="#9aa0a6" font-size="11">prepares, never deploys</text>

  <rect x="628" y="150" width="272" height="74" rx="8" fill="#26272a" stroke="#c9a227" stroke-width="1.5"/>
  <text x="764" y="176" text-anchor="middle" fill="#e8e8e8" font-size="14" font-weight="600">&#128269; Kimi</text>
  <text x="764" y="196" text-anchor="middle" fill="#9aa0a6" font-size="11.5">independent safety audit</text>
  <text x="764" y="213" text-anchor="middle" fill="#c9a227" font-size="11">read-only &#183; human-mediated</text>

  <text x="470" y="243" text-anchor="middle" fill="#6fae6f" font-size="11.5">committed to disk before anyone sees anyone else</text>
  <line x1="470" y1="250" x2="470" y2="272" stroke="#8a8a8a" stroke-width="2" marker-end="url(#a)"/>

  <!-- round 2 -->
  <text x="40" y="292" fill="#9aa0a6" font-size="12" letter-spacing="1.2" font-weight="700">ROUND 2 &#183; EACH SEES THE OTHERS</text>
  <rect x="40" y="302" width="860" height="60" rx="8" fill="#212225" stroke="#3a3b3e" stroke-width="1.5"/>
  <text x="470" y="326" text-anchor="middle" fill="#e8e8e8" font-size="13">peer findings arrive as <tspan fill="#c9a227">labelled data, never as prose</tspan> &#8212; an agent's output is untrusted input</text>
  <text x="470" y="348" text-anchor="middle" fill="#9aa0a6" font-size="11.5">agree &#183; disagree with evidence &#183; revise &#183; or ask: <tspan fill="#e8e8e8" font-family="monospace">REQUEST: codex - is that volume read-only?</tspan></text>

  <line x1="470" y1="364" x2="470" y2="386" stroke="#8a8a8a" stroke-width="2" marker-end="url(#a)"/>
  <path d="M906 332 C 928 332, 928 200, 906 200" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="925" y="266" text-anchor="middle" fill="#9aa0a6" font-size="10" transform="rotate(90 925 266)">more rounds only if asked</text>

  <!-- synthesis -->
  <rect x="40" y="392" width="860" height="60" rx="8" fill="#26272a" stroke="#3a3b3e" stroke-width="1.5"/>
  <text x="470" y="416" text-anchor="middle" fill="#e8e8e8" font-size="14" font-weight="600">SYNTHESIS &#8212; a free model from a different family, which reviewed nothing</text>
  <text x="470" y="438" text-anchor="middle" fill="#9aa0a6" font-size="11.5">AGREED &#183; CONTRADICTIONS &#183; <tspan fill="#e06c6c">UNSUPPORTED (excluded from the plan)</tspan> &#183; PLAN &#183; EXCLUDED</text>

  <line x1="470" y1="454" x2="470" y2="476" stroke="#8a8a8a" stroke-width="2" marker-end="url(#a)"/>

  <!-- human gate -->
  <rect x="40" y="482" width="860" height="56" rx="8" fill="#2a2320" stroke="#e0a06c" stroke-width="2"/>
  <text x="470" y="506" text-anchor="middle" fill="#e0a06c" font-size="15" font-weight="700">&#9208; HUMAN APPROVAL &#8212; the run stops here</text>
  <text x="470" y="527" text-anchor="middle" fill="#9aa0a6" font-size="11.5">the approval is bound to a hash of this exact plan; edit the plan and it is void</text>

  <line x1="470" y1="540" x2="470" y2="558" stroke="#8a8a8a" stroke-width="2" marker-end="url(#a)"/>

  <!-- execute -->
  <rect x="40" y="562" width="420" height="44" rx="8" fill="#26272a" stroke="#3a3b3e" stroke-width="1.5"/>
  <text x="250" y="580" text-anchor="middle" fill="#e8e8e8" font-size="13" font-weight="600">EXECUTE &#8212; Claude only</text>
  <text x="250" y="597" text-anchor="middle" fill="#9aa0a6" font-size="11">approval + claim + intent record &#183; dry-run by default</text>

  <rect x="480" y="562" width="420" height="44" rx="8" fill="#26272a" stroke="#6fae6f" stroke-width="1.5"/>
  <text x="690" y="580" text-anchor="middle" fill="#e8e8e8" font-size="13" font-weight="600">VERIFY &#8212; Kimi + Codex</text>
  <text x="690" y="597" text-anchor="middle" fill="#6fae6f" font-size="11">never Claude: it made the change</text>
</svg>
