  # Billal's screenshot. Set as the cover rather than the figure: it is the real
  # repository and makes a recognisable card, while the figure below carries the
  # argument and belongs inline. Swap the cover flag if you disagree.
  - src: static/images/posts/leak-gate/repo-after-the-gate.png
    alt: "The GitHub page for the blog repository after the leak gate landed. The file tree shows scripts, tests/leak-gate and .github/workflows, with recent commit messages about enforcing the site-pattern count and pinning the runner image. A banner offers to open a pull request for the feat/leak-gate branch."
    cover: true
    redactions: >-
      none needed. Checked frame-wide, not just the subject: no bookmarks bar
      (the thing that leaked an internal hostname on an earlier post), no
      terminal scrollback, no notification popups, no internal hostnames,
      addresses or tokens. Everything visible is public repository content at a
      URL already linked from the blog. No EXIF and no GPS; the only PNG chunks
      present are sRGB, gAMA and pHYs, which carry nothing about origin.
  - src: static/images/posts/leak-gate/pr-checks-passed.png
    alt: "The pull request for this post's own draft branch on GitHub, showing seven successful checks: Cloudflare Pages, CodeQL code scanning results, three CodeQL analyses for actions, javascript-typescript and python, and the leak gate twice - once for the pull request and once for the branch push."
    redactions: >-
      none needed. Checked frame-wide: no bookmarks bar entries, no terminal
      scrollback, no notification popups, no internal hostnames, addresses or
      tokens. The only link in frame beyond the public repository is the
      Claude-Session URL, which already appears in every commit message on this
      repository and is account-scoped rather than readable by a visitor. No
      EXIF, no GPS; only sRGB, gAMA and pHYs chunks.
  - src: static/images/posts/leak-gate/fail-open.svg
    alt: "A table of four leak-gate configurations and their exit codes before and after the pattern-count check. Secret unset, all-commented secret, and an unedited placeholder pattern each exited 0 and reported a clean scan before the check existed; all three exit 2 after. A correct secret exits 0 in both."
    redactions: "none needed - generated SVG, no camera metadata, no real addresses or hostnames"

# Everything below was proposed by the homelab agent rather than taken from
# Bill's own words. Phase 4 requires the PR to list these; they belong here
# rather than in a commit message, because the repo agent reads this file and
# not the git history. The first version of this handoff put them in a commit
# message, where nothing downstream could see them.
notes_for_repo_agent: |
  - series "Building the Blog" and seriesTitle "The leak gate" are PROPOSALS.
    That series already holds three entries about this publishing pipeline and
    its security, so this reads as the fourth. Not Bill's words.
  - The title "A clean result that means nothing" is a working title. It is
    meant to echo the line from the maintenance post - "a wrong answer that
    looks like good news is worse than no answer at all" - since this project
    is that same lesson applied to the thing built to prevent it. Refine it if
    something lands better.
  - repo-after-the-gate.png is set as the cover because it is the real
    repository and makes a recognisable card, while pr-checks-passed.png
    carries the argument and is placed inline. Swap if you disagree.
  - The body quotes an SNMP OID and an SVG coordinate run as examples. Written
    out as standalone fragments these parse as routable IPv4 and the leak gate
    will fail the branch - it happened three times while this was being
    written. If you reword that section, keep the fragments embedded or
    describe them rather than quoting them.
  - Two numbers in the body are measurements from this session and should not
    be rounded or restated: 31 false positives on the first calibration run,
    and 87 tests. If the test count has moved by the time you publish, check it
    rather than trusting the prose.

redacted: true
redaction_notes: |
  - No real DDNS hostname anywhere; the post uses the published placeholder
    mylab.duckdns.org, which is what four existing posts already use.
  - No real WAN address. The only IPs in the post are a documentation-range
    address and an SNMP OID.
  - No credentials, tokens or key material. The lab-specific pattern itself is
    never quoted - the post describes what such a pattern is for, not what mine
    matches.
  - Three images. The SVG is generated from this session's own measurements, so
    it carries no EXIF and no camera or location data. The PNG screenshot was
    screenshots were inspected frame-wide before inclusion - browser chrome,
    scrollback and popups as well as the subject - and show only public
    repository content. None of the three carries EXIF or GPS.
  - Repository and site URLs are already public and already linked from the blog.

lab_changes:
  detections_added: 0
  new_flows:
    - "draft branch -> leak gate CI -> pull request"
  incidents:
    - title: "CI ran for three runs against a stale secret, reporting clean"
      status: "fixed"
