# Detection catalogue — rendered on /detections/ by layouts/_default/detections.html.
# EVERY rule here is copied verbatim from the live config on the lab host:
#   /etc/prometheus/alert_rules.yml                      (29 rules)
#   ~/homelab/containers/loki/rules/security.yml         (24 rules)
# If a rule changes on disk, change it here. No invented rules, no invented
# thresholds. ATT&CK mappings are the analyst's call and are labelled as such.
#
# Rebuilt 2026-09-06. This file previously claimed 4 rules ("two on metrics, two
# on logs") and pointed at a pre-migration path. The lab had 35.

# Counts must be DERIVED from the lists below, never typed from memory (CLAUDE.md).
# The split is the `engine:` field, which is the authoritative logs-vs-metrics
# grouping — NOT the security:/health: split, which groups by purpose and does not
# line up (security 23 / health 30, because one Loki rule lives under health:).
# Anchor the greps to the 4-space entry indent, or they also match these very comment
# lines and come back one high each (`hunts:` carries no `engine:`, so it adds none):
#   grep -c '^    engine: "Loki ruler"$' data/detections.yaml   -> 24  (logs)
#   grep -c '^    engine: "Prometheus"$' data/detections.yaml   -> 29  (metrics)
#                                                                  53  total
# Corrected 2026-09-25: this read "18 on logs, 18 on metrics", which contradicted
# its own 53 headline (18+18=36) and the 24/29 split stated in data/lab.yaml and in
# this file's header. Exactly the drift the CLAUDE.md derive-don't-guess rule exists
# to catch, and it was rendering live on /detections/.
numbers:
  - value: "53"
    label: "live alert rules — 24 on logs, 29 on metrics"
  - value: "7"
    label: "log sources feeding detection"
  # Distinct attack_id values, which is what /detections/ renders per rule and what a
  # reader can therefore count off the page (anchored, so the empty attack_id: "" on
  # the health rules and these comments don't inflate it):
  #   grep -oE '^    attack_id: "T[^"]+"' data/detections.yaml | sort -u | wc -l  -> 18
  # Counting PARENT techniques instead (collapsing T1110.001 into T1110) gives 14:
  #   ... | grep -oE 'T[0-9]+' | sort -u | wc -l                                  -> 14
  # Neither is 16, which is what this said before 2026-09-25.
  - value: "18"
    label: "MITRE ATT&CK techniques mapped"
  - value: "5m"
    label: "the window most log rules evaluate over"

# ATT&CK tactics this catalogue currently touches (for the coverage strip).
tactics:
  - "Credential Access"
  - "Privilege Escalation"
  - "Reconnaissance"
  - "Command and Control"
  - "Initial Access"
  - "Execution"
  - "Defense Evasion"
  - "Persistence"
  - "Impact"

# Security detections — fire on adversary behaviour. ATT&CK-mapped.
security:
  - name: "SSHBruteForce"
    severity: "critical"
    engine: "Loki ruler"
    source: '{job="auth"}'
    expr: 'sum(count_over_time({job="auth"} |= "Failed password" [5m])) > 10'
    trips: "More than 10 failed SSH passwords in a rolling 5 minutes. Fires after 0m."
    catches: "Password guessing against SSH. Kept as the aggregate half of a pair: it still catches a distributed attempt spread across many source addresses that the per-source rule below would miss. Proven end to end on 2026-09-06 with two deliberately generated failed logins, after 30 days of matching nothing."
    attack_id: "T1110"
    attack_name: "Brute Force"
    attack_tactic: "Credential Access"
    post: "/posts/homelab-soc-logs-detections-dashboard/"
  - name: "SSHBruteForceSource"
    severity: "critical"
    engine: "Loki ruler"
    source: '{job="auth"}'
    expr: 'sum by (src_ip) (count_over_time({job="auth"} |= "Failed password" | regexp `from (?P<src_ip>[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)` [5m])) > 5'
    trips: "More than 5 failed SSH passwords from one source address in 5 minutes. Fires after 0m."
    catches: "The same behaviour as above, but attributed. The aggregate rule cannot name the host to block; only this one can. The source address is parsed at query time rather than indexed, so it costs nothing in cardinality. Real observed baseline across 28 days of raw logs: zero."
    attack_id: "T1110.001"
    attack_name: "Password Guessing"
    attack_tactic: "Credential Access"
    post: "/posts/homelab-soc-logs-detections-dashboard/"
  - name: "SudoAuthFailureBurst"
    severity: "warning"
    engine: "Loki ruler"
    source: '{job="auth"}'
    expr: 'sum(count_over_time({job="auth"} |= "sudo" |~ "(authentication failure|auth could not identify password)" [5m])) > 15'
    trips: "More than 15 rejected sudo passwords in 5 minutes. Fires after 0m."
    catches: "Local privilege escalation attempts. Threshold derived from 28 days of rotated raw logs where the real maximum was 12, all of it one person fighting a password prompt. It first shipped at 5 against a baseline measured over 7 days that was believed to be 30, and would have fired on ordinary use."
    attack_id: "T1548.003"
    attack_name: "Sudo and Sudo Caching"
    attack_tactic: "Privilege Escalation"
    post: "/posts/homelab-soc-logs-detections-dashboard/"
  - name: "SocAnalystSilent"
    severity: "warning"
    engine: "Loki ruler"
    source: '{{job="soc-analyst"}}'
    expr: 'absent_over_time({job="soc-analyst"} [20m])'
    trips: "No output at all from the AI SOC analyst for 20 minutes, sustained for 10."
    catches: "The analyst layer failing quietly. It is an ENHANCEMENT — the SOC is unaffected if it stops — but a dead analyst that nobody notices leaves someone believing alerts are being triaged when they are not. This only became possible once the analyst emitted an idle heartbeat: before that, a healthy analyst with no alerts to work on produced nothing, so silence and death were indistinguishable and an absence rule would have fired constantly during normal operation."
    attack_id: ""
    attack_name: ""
    attack_tactic: "Assurance"
    post: "/posts/homelab-soc-logs-detections-dashboard/"
  - name: "FirewallBlockSpike"
    severity: "warning"
    engine: "Loki ruler"
    source: '{job="pfsense", action="block"}'
    expr: 'sum(count_over_time({job="pfsense", action="block"} | dst_ip != "" | dst_ip !~ ".*[.]255" | dst_ip !~ "2(2[4-9]|3[0-9])[.].*" | dst_ip !~ "ff0.*" [5m])) > 75'
    trips: "More than 400 firewall blocks in 5 minutes, sustained for 2. Fires after 2m."
    catches: "A burst of dropped packets at the perimeter, which is the shape of a port scan or recon sweep. Threshold derived from 46 days of the raw firewall log: median 75, p95 225, max 347."
    attack_id: "T1595"
    attack_name: "Active Scanning"
    attack_tactic: "Reconnaissance"
    post: "/posts/homelab-siem-loki/"
  - name: "FirewallBlockSourceFlood"
    severity: "warning"
    engine: "Loki ruler"
    source: '{job="pfsense", action="block"}'
    expr: 'sum by (src_ip) (count_over_time({job="pfsense", action="block"} | dst_ip != "" | dst_ip !~ ".*[.]255" | dst_ip !~ "2(2[4-9]|3[0-9])[.].*" | dst_ip !~ "ff0.*" [5m])) > 40'
    trips: "More than 250 blocks from a single source in 5 minutes, sustained for 2. Fires after 2m."
    catches: "One noisy host hiding inside a normal-looking total. Observed per-source maximum over the same window was 191."
    attack_id: "T1595.001"
    attack_name: "Scanning IP Blocks"
    attack_tactic: "Reconnaissance"
    post: "/posts/homelab-siem-loki/"
  - name: "FirewallOutboundBlock"
    severity: "warning"
    engine: "Loki ruler"
    source: '{job="pfsense", action="block", direction="out"}'
    expr: 'sum(count_over_time({job="pfsense", action="block", direction="out"} [5m])) > 0'
    trips: "Any outbound block at all. Fires after 0m."
    catches: "Every one of 410,982 parsed firewall events across 46 days was inbound. An outbound block therefore means something changed: a new egress rule, or a host on this network reaching for something it should not. Zero false positives by construction."
    attack_id: "T1071"
    attack_name: "Application Layer Protocol"
    attack_tactic: "Command and Control"
    post: "/posts/homelab-siem-loki/"
  - name: "VpnInterfaceBlockSpike"
    severity: "critical"
    engine: "Loki ruler"
    source: '{job="pfsense", interface="tun_wg0"}'
    expr: 'sum(count_over_time({job="pfsense", action="block", interface="tun_wg0"} [5m])) > 5'
    trips: "More than 5 blocks on the WireGuard interface in 5 minutes. Fires after 0m."
    catches: "Traffic being denied on the one interface that is supposed to carry only trusted, authenticated peers. Either a misconfigured client or something probing the tunnel."
    attack_id: "T1133"
    attack_name: "External Remote Services"
    attack_tactic: "Initial Access"
    post: "/posts/homelab-siem-loki/"
  - name: "AgentAuditCriticalRisk"
    severity: "critical"
    engine: "Loki ruler"
    source: '{job="agent-auditor"}'
    expr: 'sum(count_over_time({job="agent-auditor", risk="critical"} [5m])) > 0'
    trips: "Any action the auditor scored as critical risk. Fires after 0m."
    catches: "The AI agent with real access to this lab attempting something the audit plane considers dangerous. The agent builds; a separate plane judges."
    attack_id: "T1059"
    attack_name: "Command and Scripting Interpreter"
    attack_tactic: "Execution"
    post: "/posts/auditing-the-ai-agent-that-runs-my-homelab/"
  - name: "AgentAuditPolicyViolation"
    severity: "critical"
    engine: "Loki ruler"
    source: '{job="agent-auditor"}'
    expr: 'sum(count_over_time({job="agent-auditor", verdict="POLICY_VIOLATION"} [5m])) > 0'
    trips: "Any POLICY_VIOLATION verdict. Fires after 0m."
    catches: "The agent crossed a written rule. Observe-only today, so this alert is the enforcement."
    attack_id: "T1562"
    attack_name: "Impair Defenses"
    attack_tactic: "Defense Evasion"
    post: "/posts/auditing-the-ai-agent-that-runs-my-homelab/"
  - name: "AgentAuditUnverifiable"
    severity: "warning"
    engine: "Loki ruler"
    source: '{job="agent-auditor"}'
    expr: 'sum(count_over_time({job="agent-auditor", verdict="UNVERIFIABLE"} [10m])) > 0'
    trips: "Any UNVERIFIABLE verdict in 10 minutes. Fires after 0m."
    catches: "The auditor could not prove what the agent claimed. Not proof of wrongdoing, and that is the point: an unverifiable claim is a gap in evidence, which is worth knowing about separately from a violation."
    attack_id: ""
    attack_name: ""
    attack_tactic: "Assurance"
    post: "/posts/auditing-the-ai-agent-that-runs-my-homelab/"
  - name: "AgentAuditReviewFailure"
    severity: "warning"
    engine: "Loki ruler"
    source: '{job="agent-auditor"}'
    expr: 'sum(count_over_time({job="agent-auditor", stage="ReviewFailed"} [10m])) > 0'
    trips: "Any ReviewFailed stage in 10 minutes. Fires after 0m."
    catches: "The review step itself broke. A detection plane that fails silently is worse than none, so its own failure is an alert."
    attack_id: ""
    attack_name: ""
    attack_tactic: "Assurance"
    post: "/posts/auditing-the-ai-agent-that-runs-my-homelab/"
  - name: "AuthentikLoginFailureBurst"
    severity: "critical"
    engine: "Loki ruler"
    source: '{job="authentik-events"}'
    expr: 'sum by (client_ip) (count_over_time({job="authentik-events", action="login_failed"} [5m])) > 12'
    trips: "More than 12 failed identity-provider logins from one client address in 5 minutes. Fires after 0m."
    catches: "Credential stuffing or password spraying against single sign-on, which fronts every service in the lab. These events never appear on the identity provider's stdout; they are lifted out of its database by a dedicated exporter with an allow-listed projection."
    attack_id: "T1110.003"
    attack_name: "Password Spraying"
    attack_tactic: "Credential Access"
    post: "/posts/homelab-soc-logs-detections-dashboard/"
  - name: "AuthentikSuspiciousRequest"
    severity: "warning"
    engine: "Loki ruler"
    source: '{job="authentik-events"}'
    expr: 'sum by (client_ip) (count_over_time({job="authentik-events", action="suspicious_request"} [5m])) > 0'
    trips: "Any request the identity provider itself flags as suspicious. Fires after 0m."
    catches: "The identity provider's own judgement, surfaced rather than left in its database."
    attack_id: "T1078"
    attack_name: "Valid Accounts"
    attack_tactic: "Defense Evasion"
    post: "/posts/homelab-soc-logs-detections-dashboard/"
  - name: "AuthentikAuthenticatorRemoved"
    severity: "critical"
    engine: "Loki ruler"
    source: '{job="authentik-events"}'
    expr: 'sum by (username) (count_over_time({job="authentik-events", action="custom_static_authenticator_disable"} [5m])) > 0'
    trips: "Any MFA authenticator being removed. Fires after 0m."
    catches: "Removing a second factor is a normal admin action and a classic account-takeover step. It is rare enough here to alert on every occurrence rather than a threshold."
    attack_id: "T1556.006"
    attack_name: "Multi-Factor Authentication"
    attack_tactic: "Persistence"
    post: "/posts/homelab-soc-logs-detections-dashboard/"
  - name: "ContainerFatalError"
    severity: "critical"
    engine: "Loki ruler"
    source: '{job="containers"}'
    expr: 'sum by (container_id) (count_over_time({job="containers"} |~ `(?i)(panic:|level=fatal|"level":"fatal"|\[fatal\]|traceback \(most recent)` [5m])) > 0'
    trips: "Any panic, fatal, or Python traceback in any container. Fires after 0m."
    catches: "A service crashing rather than degrading. Matched with a top-level alternation and no leading wildcard, deliberately: the other shape silently matches nothing on this Loki version."
    attack_id: ""
    attack_name: ""
    attack_tactic: "Health"
    post: "/posts/homelab-soc-logs-detections-dashboard/"
  - name: "ContainerErrorSpike"
    severity: "warning"
    engine: "Loki ruler"
    source: '{job="containers"}'
    expr: 'sum(count_over_time({job="containers"} |~ `(?i)(level=error|"level":"error")` [5m])) > 25'
    trips: "More than 25 container error lines in 5 minutes, sustained for 2. Fires after 2m."
    catches: "Something is broken and nobody has opened a terminal. Derived over the full 7-day retention: 13 non-zero buckets, median 8, second-highest 17, max 65. The one bucket above 25 was a real fault, so the threshold is confirmed rather than raised. Seven days is the honest maximum here, because a container's log file is deleted when the container is recreated."
    attack_id: ""
    attack_name: ""
    attack_tactic: "Health"
    post: "/posts/homelab-soc-logs-detections-dashboard/"
  - name: "ContainerLogIngestionStopped"
    severity: "critical"
    engine: "Loki ruler"
    source: '{job="containers"}'
    expr: 'absent_over_time({job="containers"} [15m])'
    trips: "No container logs at all for 15 minutes. Fires after 15m."
    catches: "The detection stack going blind. Everything above depends on logs arriving, so the absence of logs is itself the signal. This is the rule that watches the watchers."
    attack_id: "T1562.008"
    attack_name: "Impair Defenses: Disable or Modify Cloud Logs"
    attack_tactic: "Defense Evasion"
    post: "/posts/homelab-soc-logs-detections-dashboard/"

# Health & availability — fire on the lab hurting itself, but also serve as
# tripwires for the impact stage of an attack.
  - name: "FirewallBroadcastStorm"
    severity: "warning"
    engine: "Loki ruler"
    source: '{job="pfsense", action="block"}'
    expr: 'sum(count_over_time({job="pfsense", action="block"} | dst_ip =~ ".*[.]255" [5m])) > 2500'
    trips: "More than 2,500 broadcast or multicast blocks in 5 minutes. 7-day observed maximum was 919."
    catches: "Broadcast storms — a switching loop, DHCP starvation, NetBIOS amplification. Split out from the unicast rules on 2026-09-09 after measuring that 98.3 per cent of all firewall blocks were broadcast noise: a device opening Spotify was tripping the security rules. Deliberately NOT a security signal; the threshold sits above a known-benign spike."
    attack_id: "T1498"
    attack_name: "Network Denial of Service"
    attack_tactic: "Impact"
    post: "/posts/network-digital-twin/"
  - name: "FirewallBroadcastSourceStorm"
    severity: "warning"
    engine: "Loki ruler"
    source: '{job="pfsense", action="block"}'
    expr: 'sum by (src_ip) (count_over_time({job="pfsense", action="block"} | dst_ip =~ ".*[.]255" [5m])) > 1500'
    trips: "A single source broadcasting more than 1,500 times in 5 minutes. 7-day maximum was 787, which was benign."
    catches: "One device flooding the segment. Network health rather than security — the per-source unicast rule below is the one tuned for adversary behaviour."
    attack_id: "T1498"
    attack_name: "Network Denial of Service"
    attack_tactic: "Impact"
    post: "/posts/network-digital-twin/"
  - name: "NetworkDriftUnexpectedService"
    severity: "warning"
    engine: "Loki ruler"
    source: '{job="network-twin", detection="DRIFT-004"}'
    expr: 'sum(count_over_time({job="network-twin", detection="DRIFT-004"} [10m])) > 0'
    trips: "Any confirmed DRIFT-004 in the last 10 minutes. No additional wait: the finding already survived two consecutive trustworthy observations before a line was written."
    catches: "A reachable service that is not in the NetBox inventory. The finding this platform exists for. Proven end to end on 2026-09-10 with a listener bound on tcp/8888, confirmed after two observations and delivered to the phone."
    attack_id: "T1571"
    attack_name: "Non-Standard Port"
    attack_tactic: "Command and Control"
    post: "/posts/network-digital-twin/"
  - name: "NetworkDriftMissingService"
    severity: "warning"
    engine: "Loki ruler"
    source: '{job="network-twin", detection="DRIFT-005"}'
    expr: 'sum(count_over_time({job="network-twin", detection="DRIFT-005"} [10m])) > 0'
    trips: "Any confirmed DRIFT-005 in the last 10 minutes. Requires three consecutive misses upstream, roughly 45 minutes."
    catches: "A documented service that has stopped answering. Heavily gated on purpose: a service is 'missing' for one observation during any restart, and no missing-service finding is ever raised from a failed or suspect scan."
    attack_id: "T1489"
    attack_name: "Service Stop"
    attack_tactic: "Impact"
    post: "/posts/network-digital-twin/"
  - name: "NetworkDriftHighSeverity"
    severity: "critical"
    engine: "Loki ruler"
    source: '{job="network-twin", event_type="network_drift"}'
    expr: 'sum(count_over_time({job="network-twin", event_type="network_drift", severity=~"HIGH|CRITICAL"} [10m])) > 0'
    trips: "Any drift event the engine rated HIGH or CRITICAL."
    catches: "Severity is set deterministically by the drift engine, not by this rule. If it ever emits HIGH or CRITICAL that judgement was already made from evidence, so it pages rather than sitting on a dashboard."
    attack_id: "T1571"
    attack_name: "Non-Standard Port"
    attack_tactic: "Command and Control"
    post: "/posts/network-digital-twin/"

health:
  - name: "InstanceDown"
    severity: "critical"
    engine: "Prometheus"
    source: "up == 0"
    expr: 'up == 0'
    trips: "A scrape target unreachable for 10 continuous minutes."
    catches: "A service, or the whole box, is gone. Primarily availability, but a service stopped or cut off is also how the impact stage of an attack looks."
    attack_id: "T1489"
    attack_name: "Service Stop"
    attack_tactic: "Impact"
    tripwire: true
    post: "/posts/metrics-arent-monitoring/"
  - name: "DiskAlmostFull"
    severity: "warning"
    engine: "Prometheus"
    source: "node_exporter"
    expr: '100 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} * 100) > 85'
    trips: "Root filesystem over 85% full for 15 minutes."
    catches: "The classic silent killer: a full disk stops logging, databases and backups. Catching it early keeps the detection stack alive to detect anything else."
    attack_id: ""
    attack_name: ""
    attack_tactic: "Health"
    tripwire: false
    post: "/posts/metrics-arent-monitoring/"
  - name: "HostMemoryPressure"
    severity: "warning"
    engine: "Prometheus"
    source: "node_exporter"
    expr: 'node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.15'
    trips: "Available memory under 15% for 5 minutes."
    catches: "Memory exhaustion on a box that has frozen before under concurrent load."
    attack_id: ""
    attack_name: ""
    attack_tactic: "Health"
    tripwire: false
    post: "/posts/metrics-arent-monitoring/"
  - name: "HostSwapNearlyFull"
    severity: "warning"
    engine: "Prometheus"
    source: "node_exporter"
    expr: 'see /etc/prometheus/alert_rules.yml'
    trips: "Swap nearly exhausted for 10 minutes."
    catches: "The step before the out-of-memory killer starts choosing victims."
    attack_id: ""
    attack_name: ""
    attack_tactic: "Health"
    tripwire: false
    post: "/posts/metrics-arent-monitoring/"
  - name: "HostSwapThrashing"
    severity: "critical"
    engine: "Prometheus"
    source: "node_exporter"
    expr: 'rate(node_vmstat_pswpin[5m]) + rate(node_vmstat_pswpout[5m]) > 128'
    trips: "Sustained swap in/out above 128 pages per second for 5 minutes."
    catches: "The machine spending its time moving memory rather than doing work."
    attack_id: ""
    attack_name: ""
    attack_tactic: "Health"
    tripwire: false
    post: "/posts/metrics-arent-monitoring/"
  - name: "HostIOStall"
    severity: "critical"
    engine: "Prometheus"
    source: "node_exporter PSI"
    expr: 'rate(node_pressure_io_stalled_seconds_total[5m]) > 0.05'
    trips: "I/O pressure stalling above 5% for 5 minutes."
    catches: "Processes blocked waiting on disk, measured from pressure stall information rather than inferred from utilisation."
    attack_id: ""
    attack_name: ""
    attack_tactic: "Health"
    tripwire: false
    post: "/posts/metrics-arent-monitoring/"
  - name: "HostDiskSaturation"
    severity: "warning"
    engine: "Prometheus"
    source: "node_exporter"
    expr: 'rate(node_disk_io_time_seconds_total{device=~"sd.*|vd.*|nvme.*"}[5m]) > 0.60'
    trips: "Disk busy over 60% for 5 minutes."
    catches: "Sustained saturation on the underlying storage."
    attack_id: ""
    attack_name: ""
    attack_tactic: "Health"
    tripwire: false
    post: "/posts/metrics-arent-monitoring/"
  - name: "HostMajorPageFaultStorm"
    severity: "warning"
    engine: "Prometheus"
    source: "node_exporter"
    expr: 'rate(node_vmstat_pgmajfault[5m]) > 25'
    trips: "More than 25 major page faults per second for 5 minutes."
    catches: "Memory pressure showing up as disk reads."
    attack_id: ""
    attack_name: ""
    attack_tactic: "Health"
    tripwire: false
    post: "/posts/metrics-arent-monitoring/"
  - name: "HostClockUnsynchronised"
    severity: "warning"
    engine: "Prometheus"
    source: "node_exporter"
    expr: 'node_timex_sync_status == 0'
    trips: "Clock unsynchronised for 15 minutes."
    catches: "Time drift breaks log correlation, certificate validation and every time-windowed detection above."
    attack_id: "T1070.006"
    attack_name: "Timestomp"
    attack_tactic: "Defense Evasion"
    tripwire: true
    post: "/posts/metrics-arent-monitoring/"
  - name: "HostClockDrifting"
    severity: "warning"
    engine: "Prometheus"
    source: "node_exporter"
    expr: 'abs(node_timex_offset_seconds) > 0.5'
    trips: "Clock offset over 0.5 seconds for 10 minutes."
    catches: "Drift before it becomes a correlation problem."
    attack_id: ""
    attack_name: ""
    attack_tactic: "Health"
    tripwire: false
    post: "/posts/metrics-arent-monitoring/"
  - name: "LabClockWrongVsWorld"
    severity: "critical"
    engine: "Prometheus"
    source: "custom exporter"
    expr: 'abs(lab_clock_external_skew_seconds) > 30'
    trips: "Local clock more than 30 seconds from external reference for 10 minutes."
    catches: "The whole lab agreeing on a time that is wrong, which internal comparison alone cannot catch."
    attack_id: "T1070.006"
    attack_name: "Timestomp"
    attack_tactic: "Defense Evasion"
    tripwire: true
    post: "/posts/metrics-arent-monitoring/"
  - name: "LabTimeServerUnsynchronised"
    severity: "warning"
    engine: "Prometheus"
    source: "custom exporter"
    expr: 'lab_ntp_server_stratum == 0 or lab_ntp_server_stratum >= 16'
    trips: "Lab time server unsynchronised for 20 minutes."
    catches: "The source everything else trusts having no source of its own."
    attack_id: ""
    attack_name: ""
    attack_tactic: "Health"
    tripwire: false
    post: "/posts/metrics-arent-monitoring/"
  - name: "LabTimeServerOffset"
    severity: "critical"
    engine: "Prometheus"
    source: "custom exporter"
    expr: 'abs(lab_ntp_server_offset_seconds) > 5'
    trips: "Time server offset over 5 seconds for 10 minutes."
    catches: "The time server drifting while still claiming to be synchronised."
    attack_id: ""
    attack_name: ""
    attack_tactic: "Health"
    tripwire: false
    post: "/posts/metrics-arent-monitoring/"
  - name: "LabClockCheckStale"
    severity: "warning"
    engine: "Prometheus"
    source: "custom exporter"
    expr: 'lab_clock_external_check_up == 0 or absent(lab_clock_external_check_up)'
    trips: "The external clock check itself missing for 30 minutes."
    catches: "A check that has stopped running reports no problems, which looks identical to no problems."
    attack_id: ""
    attack_name: ""
    attack_tactic: "Assurance"
    tripwire: false
    post: "/posts/metrics-arent-monitoring/"
  - name: "LabBackupStale"
    severity: "critical"
    engine: "Prometheus"
    source: "custom exporter"
    expr: 'time() - lab_backup_last_success_seconds > 108000'
    trips: "No successful backup in 30 hours."
    catches: "Backups silently stopping, which is only ever discovered when one is needed."
    attack_id: "T1490"
    attack_name: "Inhibit System Recovery"
    attack_tactic: "Impact"
    tripwire: true
    post: "/posts/metrics-arent-monitoring/"
  - name: "LabBackupUndersized"
    severity: "critical"
    engine: "Prometheus"
    source: "custom exporter"
    expr: 'lab_backup_last_size_bytes < 2000000'
    trips: "Last backup under 2 MB."
    catches: "A backup that ran, reported success, and contains almost nothing."
    attack_id: "T1490"
    attack_name: "Inhibit System Recovery"
    attack_tactic: "Impact"
    tripwire: true
    post: "/posts/metrics-arent-monitoring/"
  - name: "LabBackupIncomplete"
    severity: "critical"
    engine: "Prometheus"
    source: "custom exporter"
    expr: 'lab_backup_last_artefacts < 4'
    trips: "Fewer than 4 artefacts in the last backup."
    catches: "A partial set that would restore some services and not others."
    attack_id: "T1490"
    attack_name: "Inhibit System Recovery"
    attack_tactic: "Impact"
    tripwire: true
    post: "/posts/metrics-arent-monitoring/"
  - name: "LabBackupMetricAbsent"
    severity: "warning"
    engine: "Prometheus"
    source: "custom exporter"
    expr: 'absent(lab_backup_last_success_seconds)'
    trips: "The backup metric missing entirely for 45 minutes."
    catches: "Not a failed backup but a missing answer, which is the more dangerous of the two."
    attack_id: ""
    attack_name: ""
    attack_tactic: "Assurance"
    tripwire: false
    post: "/posts/metrics-arent-monitoring/"

# Threat-hunting queries — interactive LogQL in Grafana Explore, not (yet) alerts.
  - name: "NetworkTwinSilent"
    severity: "warning"
    engine: "Loki ruler"
    source: '{job="network-twin"}'
    expr: 'absent_over_time({job="network-twin"} [40m])'
    trips: "No records at all in 40 minutes, allowing for two missed 15-minute runs plus the randomised delay."
    catches: "Absence-as-signal. The twin writes an audit record every run, so silence means network drift is unmonitored. A component that only writes on findings cannot be told apart from a dead one."
    post: "/posts/network-digital-twin/"
  - name: "LabCertExpiringSoon"
    severity: "warning"
    engine: "Prometheus"
    source: 'lab_cert_expiry_timestamp_seconds'
    expr: '(lab_cert_expiry_timestamp_seconds - time()) / 86400 < 21'
    trips: "Any monitored certificate within 21 days of expiry."
    catches: "21 days is deliberate: Caddy renews at roughly 30 days remaining, so this stays silent in normal operation and speaks only when a renewal has failed or a hand-copied certificate has gone stale. The pfSense GUI serves a manual copy of Caddy's wildcard, which does not renew with it."
    post: "/posts/network-digital-twin/"
  - name: "LabCertExpiringCritical"
    severity: "critical"
    engine: "Prometheus"
    source: 'lab_cert_expiry_timestamp_seconds'
    expr: '(lab_cert_expiry_timestamp_seconds - time()) / 86400 < 5'
    trips: "Any monitored certificate within 5 days of expiry."
    catches: "The last useful warning before a browser starts refusing the firewall admin page — which is exactly the moment you least want to be training yourself to click through certificate warnings."
    post: "/posts/network-digital-twin/"
  - name: "LabCertExpired"
    severity: "critical"
    engine: "Prometheus"
    source: 'lab_cert_expiry_timestamp_seconds'
    expr: 'lab_cert_expiry_timestamp_seconds < time()'
    trips: "A monitored certificate is already past its expiry date."
    catches: "Reported rather than inferred: the probe reads the certificate without verifying it, so an already-expired certificate still yields a date instead of a blank."
    post: "/posts/network-digital-twin/"
  - name: "LabCertChainInvalid"
    severity: "warning"
    engine: "Prometheus"
    source: 'lab_cert_chain_valid'
    expr: 'lab_cert_chain_valid == 0 and lab_cert_check_up == 1'
    trips: "A served certificate fails verification against the system trust store while the endpoint is answering."
    catches: "A certificate can be well within date while the server omits its intermediate, which browsers reject. A different fault from expiry, so it gets its own rule rather than being folded in."
    post: "/posts/network-digital-twin/"
  - name: "LabCertCheckFailed"
    severity: "warning"
    engine: "Prometheus"
    source: 'lab_cert_check_up'
    expr: 'lab_cert_check_up == 0'
    trips: "An endpoint did not answer a TLS probe for 45 minutes."
    catches: "Distinguishes 'the certificate is bad' from 'nothing answered', which are different problems with different fixes."
    post: "/posts/network-digital-twin/"
  - name: "LabCertExporterStale"
    severity: "warning"
    engine: "Prometheus"
    source: 'lab_cert_exporter_last_run_timestamp_seconds'
    expr: 'time() - lab_cert_exporter_last_run_timestamp_seconds > 3600'
    trips: "The certificate exporter has not completed a run in over an hour."
    catches: "node-exporter keeps serving a textfile after its writer dies, so every certificate metric would freeze at its last good value and the expiry alerts would never fire. This is the beacon that makes that visible."
    post: "/posts/network-digital-twin/"
  - name: "LabCertMetricAbsent"
    severity: "warning"
    engine: "Prometheus"
    source: 'lab_cert_exporter_last_run_timestamp_seconds'
    expr: 'absent(lab_cert_exporter_last_run_timestamp_seconds)'
    trips: "The certificate metrics are absent entirely for 45 minutes."
    catches: "Before this exporter existed the lab had no certificate monitoring of any kind: no blackbox exporter, no ssl_ or cert_ series anywhere."
    post: "/posts/network-digital-twin/"
  - name: "DetectionNearMiss"
    severity: "warning"
    engine: "Prometheus"
    source: 'lab_detection_headroom_ratio'
    expr: 'lab_detection_headroom_ratio > 0.7'
    trips: "A rule has sat above 70 per cent of its own threshold for 30 minutes without firing."
    catches: "Threshold rules are binary — fired or did not — and everything below the line is discarded. A rule sitting at 90 per cent all week leaves no trace anywhere. Routed to a receiver with no webhook: visible in Grafana, never on the phone."
    post: "/posts/network-digital-twin/"
  - name: "DetectionPersistentLowLevel"
    severity: "warning"
    engine: "Prometheus"
    source: 'lab_detection_headroom_ratio'
    expr: 'min_over_time(lab_detection_headroom_ratio[6h]) > 0.3 and count_over_time(lab_detection_headroom_ratio[6h]) >= 24'
    trips: "A rule has stayed above 30 per cent of its threshold for six hours, and only once at least 24 real samples exist."
    catches: "Sustained low-level activity that no burst-tuned threshold will ever catch — the shape of a slow scan or a patient brute force. The sample guard was added after the first version went pending ten minutes post-install: min_over_time over six hours does not require six hours of data."
    attack_id: "T1595"
    attack_name: "Active Scanning"
    attack_tactic: "Reconnaissance"
    post: "/posts/network-digital-twin/"
  - name: "DetectionHeadroomAbsent"
    severity: "warning"
    engine: "Prometheus"
    source: 'lab_detection_headroom_rules_measured'
    expr: 'absent(lab_detection_headroom_rules_measured)'
    trips: "The headroom metrics are absent for 45 minutes."
    catches: "If the exporter dies the ratios freeze at their last values and near-miss visibility silently stops."
    post: "/posts/network-digital-twin/"
  - name: "DetectionHeadroomIncomplete"
    severity: "warning"
    engine: "Prometheus"
    source: 'lab_detection_headroom_rules_measured'
    expr: 'lab_detection_headroom_rules_measured < 5'
    trips: "Fewer than 5 rules were successfully measured for 30 minutes."
    catches: "The parser found fewer rules than expected, so it is measuring a subset while reporting confidently on the whole. Worse than measuring nothing, which is why it is its own alert."
    post: "/posts/network-digital-twin/"

hunts:
  - q: '{job="auth"} |= "Failed password"'
    for_what: "Every failed login across the lab — the raw stream the brute-force alerts count over."
  - q: '{job="pfsense"} |= "filterlog"'
    for_what: "Firewall decisions, sliceable by source, port, protocol or interface."
  - q: 'sum by (vhost) (count_over_time({job="caddy"} | status >= 400 [1h]))'
    for_what: "Failed requests per virtual host through the reverse proxy — the panel that needed a deliberately generated 404 to prove it was not silently broken."
  - q: '{job="authentik-events", action="login_failed"}'
    for_what: "Failed single sign-on attempts, lifted out of the identity provider's own database."
  - q: 'sum by (job) (count_over_time({job=~".+"}[1h]))'
    for_what: "Which sources are still reporting. A source missing from this result is a blind spot, not a quiet one."
  - q: '{job="syslog"}'
    for_what: "Everything else — the catch-all for when you don't yet know what you're looking for."
