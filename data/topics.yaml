# Curated topics for /topics/ and the chip row above the tag wall on /posts/.
#
# Why this exists: the archive carries 111 distinct tags across 39 posts, which
# is a good index and a bad front door. These six are the front door. They are
# a *view* over the tags — no post front matter changes, nothing to keep in sync
# when a post is added, and a post can belong to several topics.
#
# Rules for editing:
#   - `tags` must match the rendered tag titles exactly (Hugo title-cases them:
#     "Home-Lab", not "home-lab"). Check against /tags/ after any change.
#   - Counts are NEVER written here. They are derived by
#     layouts/_partials/topic_posts.html, so they cannot drift.
#   - "Home-Lab" is deliberately in no topic: it is on 29 of 39 posts, so it
#     describes the site rather than distinguishing anything within it.
#   - Every post must land in at least one topic. `hugo` will not tell you if
#     one does not — check /topics/ after adding a post with unusual tags.

