# The TAFE SOC project's network, as data. Read by layouts/_partials/soc_zones.html,
# which both the /tafe-soc/ hub and the dated post (through the soc-zones
# shortcode) render, so the two maps cannot disagree.
#
# Every line here comes from the project write-up (content/tafe-soc/index.md)
# or from one of its screenshots (content/tafe-soc/images/): the addresses and
# interfaces are the pfSense console's (02), FreeRADIUS on soc01 is 06, Wazuh
# on a SOC address is 14, the target VM's name and address are 01, 03 and 09,
# Kali on GUEST is 10 and 11. A zone the write-up says nothing more about has
# no `changed` list, and its panel says so rather than filling the gap.
firewall:
  name: "pfSense"
  short: "firewall and router at the centre"
  chips:
    - "routes and segments nine zones"
    - "alias-based deny · every block logged"
    - "off-host backup · RTO ~2 min 10 sec"
  does: "pfSense 2.9.0 sits at the centre as firewall and router, segmenting nine zones. Explicit deny rules enforce isolation between zones that should never touch, and every block is logged. Segmentation was designed around aliases, not one-off rules: the protected internal networks are one reusable object, so the deny policy can be reasoned about and audited as a whole."
  ran:
    - "DHCP on each zone, a mix of dynamic leases and static mappings, so known infrastructure (the SOC tooling, the DMZ target) always comes up on a predictable address."
  changed:
    - "A full backup and disaster-recovery workflow, including a genuinely off-host backup and a timed restore-and-boot test: about 2 min 10 sec measured RTO, well inside the 1-hour target."
    - "A shared lab host with SSH root login centrally locked down by policy needed a clean, self-removing workaround to get a backup archive genuinely off the host, rather than weakening the host's own controls."
  pages: [2, 3, 4, 6]

remote:
  name: "Remote access"
  short: "OpenVPN · FreeRADIUS groups"
  does: "Remote access runs through OpenVPN with FreeRADIUS authentication, where RADIUS group membership, not just a valid login, determines which internal segments a VPN client can actually reach."
  ran:
    - "FreeRADIUS, running and processing authentication requests on the SOC host, soc01."
  changed:
    - "Proven live: one RADIUS group correctly reached CORP while being refused DMZ and SOC; a second group was correctly refused entirely."
    - "RADIUS authentication first failed outright, with no reply from the server at all. It was traced back through the LDAP bind chain and fixed, confirmed by the same test accepting a valid password and rejecting an invalid one."
    - "VPN authentication failures needed careful isolation between genuine backend or config issues and simple operator error. Both occurred, and the LDAP bind chain took several more passes before it held up to a repeated test, not just a lucky first pass."
  pages: [3, 6]

detection:
  name: "Detection"
  short: "Suricata on 3 zones · Wazuh"
  does: "Two independent views of the same activity: Suricata IDS on the GUEST, DMZ and CORP segments, correlated against Wazuh."
  ran:
    - "Suricata in detection-only mode for rounds 1 to 3; round 4 was dedicated purely to validating blocking behaviour."
    - "Wazuh, on the SOC segment."
    - "Suricata's log browser, used throughout the exercise to pull logs per instance for correlation."
  changed:
    - "A detection-pipeline gap between SOC's log forwarding and Wazuh was found, corrected, and validated by forcing a fresh alert through end to end."
    - "Round 3 found a genuine gap: the generic Suricata ruleset did not alert on a boolean-based SQL injection payload at all. It was caught only via the database's own query log, and the gap and its incident-response steps went into the blue-team playbook."
    - "A domain controller's clock had drifted out of sync with the rest of the environment, quietly breaking Kerberos and skewing event timestamps across the SOC's correlated view until it was corrected."
  pages: [5, 6]

zones:
  - key: "wan"
    name: "WAN"
    side: "top"
    addr: "vtnet0 · campus uplink"
    short: "the uplink to the campus network"
    does: "The firewall's uplink to the campus network."
    changed:
      - "A campus WAN outage knocked out DHCP mid-project and had to be isolated and escalated before VPN testing could continue."
    pages: [6]
  - key: "lan"
    name: "LAN"
    side: "left"
    addr: "192.168.1.1/24 · vtnet1"
    short: "the base internal interface"
    does: "The firewall's base internal interface. The seven zones from CORP to MGMT are VLANs tagged on the same interface."
  - key: "corp"
    name: "CORP"
    side: "left"
    addr: "10.10.10.1/24 · VLAN 10"
    short: "the corporate LAN"
    tags: ["IDS"]
    does: "The corporate LAN."
    ran:
      - "Suricata IDS, detection-only until round 4."
    changed:
      - "The VPN group test: one RADIUS group reached CORP while being refused DMZ and SOC."
    pages: [3]
  - key: "soc"
    name: "SOC"
    side: "left"
    addr: "10.20.20.1/24 · VLAN 20"
    short: "the SOC analyst segment"
    tags: ["WAZUH"]
    does: "A dedicated SOC analyst segment. GUEST can never reach it."
    ran:
      - "Wazuh, the second and independent view of what Suricata saw."
      - "FreeRADIUS, on the SOC host soc01, deciding what each VPN group may reach."
      - "A DHCP static mapping, so the SOC tooling always comes up on a predictable address."
    changed:
      - "A detection-pipeline gap between SOC's log forwarding and Wazuh was found, corrected, and validated by forcing a fresh alert through end to end."
      - "A SOC log listener that had silently stopped was found, brought back up under a fresh process, and confirmed receiving events again before being signed off as resolved."
      - "The VPN tests refused SOC to both RADIUS groups."
    pages: [3, 5, 6]
  - key: "mgmt"
    name: "MGMT"
    side: "left"
    addr: "10.99.99.1/24 · VLAN 99"
    short: "firewall administration only"
    tags: ["LOCKED"]
    does: "A locked-down management plane reserved purely for firewall administration. GUEST can never reach it."
    pages: [3]
  - key: "dmz"
    name: "DMZ"
    side: "right"
    addr: "172.16.30.1/24 · VLAN 30"
    short: "public-facing, and the target"
    tags: ["IDS", "TARGET"]
    does: "The public-facing DMZ, and where the targets of the exercise lived."
    ran:
      - "VM 100, a Metasploitable-based target with a clean-baseline snapshot, rolled back between rounds so every round starts from a known, identical state."
      - "A custom PHP and MariaDB web application, deliberately built with a SQL injection flaw, later expanded with additional tables to support a full UNION-based extraction chain."
      - "Suricata IDS, detection-only until round 4."
      - "A DHCP static mapping pinning the target to a fixed address."
    changed:
      - "Zone isolation evidenced: a disallowed cross-zone request, blocked and logged with rule name and timestamp rather than silently dropped."
      - "Round 3's boolean-based SQL injection went unseen by the generic Suricata ruleset and was caught only in the database's own query log."
      - "The SQL injection surface was later expanded beyond the single boolean bypass into a full UNION-based extraction chain across three differently-shaped tables."
      - "While reviewing the app's setup, a stale reverse-proxy configuration turned up, routing requests to a service that no longer matched the current deployment."
    pages: [3, 4, 5]
  - key: "guest"
    name: "GUEST"
    side: "right"
    addr: "10.40.40.1/24 · VLAN 40"
    short: "guest access · denied SOC, MGMT"
    tags: ["IDS", "RED"]
    does: "Guest access, and where red team attacked from. Explicit deny rules mean GUEST can never reach SOC or MGMT, and every block is logged."
    ran:
      - "Kali, the red team's attack box."
      - "Suricata IDS, detection-only until round 4."
    changed:
      - "The zone's rule set was explicitly tightened to deny reach into the protected internal networks, verified by comparing the rule set before and after the change took effect."
      - "Round 2: Kali tried to reach a protected internal host directly and was explicitly blocked and logged by the firewall, with the rule name and timestamp captured, rather than silently dropped."
    pages: [4, 5]
  - key: "wificorp"
    name: "WIFICORP"
    side: "right"
    addr: "10.50.50.1/24 · VLAN 50"
    short: "corporate wifi"
    does: "Corporate wifi, as its own segment."
  - key: "wifiguest"
    name: "WIFIGUEST"
    side: "right"
    addr: "10.60.60.1/24 · VLAN 60"
    short: "guest wifi"
    does: "Guest wifi, as its own segment."
