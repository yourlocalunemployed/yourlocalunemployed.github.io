# The AI plane in detail — rendered on /ai/ by layouts/_default/ai.html.
#
# Keep every claim here defensible from a published post or from the project's
# own docs. In particular `controls` must list only things enforced in CODE.
# Anything that merely instructs an agent belongs in prose, not in that list —
# the whole point of the page is the distinction.
agents:
  - name: "Claude Code"
    icon: "🤖"
    role: "Coordinator, planner, and the only agent permitted to change anything."
    mutate: "can change things"
    mutate_class: "yes"
    facts:
      - "Read-only tools for every review stage; write tools only for the one mutating stage"
      - "Runs under root-managed hooks that log every tool call to a hash-chained ledger"
      - "Cannot verify its own change — the verification stage excludes it by design"
  - name: "Codex"
    icon: "⚙"
    role: "Implementation and test plans, and independent review of anything Claude proposes."
    mutate: "prepares, never deploys"
    mutate_class: "no"
    facts:
      - "Reviewed the one security-control change Claude wanted, and recommended against it"
      - "Ran the vulnerability scan that drove a full container remediation pass"
      - "Has its own rate limit, so the council has to cope with it being unavailable"
  - name: "Kimi Code"
    icon: "🔍"
    role: "Independent read-only auditor and long-context reviewer."
    mutate: "read-only"
    mutate_class: "never"
    facts:
      - "Launcher verifies a checksum manifest over its own policy files before it will start"
      - "Refuses prompt mode, session reuse and resumed approvals — so it cannot be automated"
      - "Participates through a deliberate human handshake rather than a widened guard"
  - name: "Moderator"
    icon: "🧩"
    role: "A fourth model that reviewed nothing, and merges what the other three found."
    mutate: "read-only"
    mutate_class: "never"
    facts:
      - "Runs on a free model on the local gateway, so the highest-volume step costs nothing"
      - "Different model family from every reviewer — a jury argument, not a cost dodge"
      - "Instructed never to resolve a disagreement by picking a side, only to state it"

pipeline:
  - stage: "intake"
    what: "One request in. A run id, and a row per stage."
  - stage: "context"
    what: "One bounded, redacted pack — identical for every agent, so disagreement means real disagreement rather than different inputs."
  - stage: "round 1"
    what: "All three answer blind, and their answers are committed to disk before anyone sees anyone else."
  - stage: "round 2"
    what: "Each reviewer sees the others' findings, passed as labelled data rather than prose, and may revise or hold."
  - stage: "extra rounds"
    what: "Only if an agent asks for one. The conversation is as long as the work needs, not a fixed count."
  - stage: "synthesis"
    what: "The moderator merges into agreed points, contradictions, unsupported claims, a plan, and exclusions."
  - stage: "human approval"
    what: "The run stops. The approval is bound to a hash of this exact plan."
    gate: true
  - stage: "execute"
    what: "Claude only, inside the approved scope, with the intent written down before anything runs."
  - stage: "verify"
    what: "Kimi and Codex — never Claude, because Claude made the change."

controls:
  - name: "Approval binding"
    enforces: "hash comparison"
    note: "The approval carries a SHA-256 of the plan. Edit the plan afterwards and the approval is void, because otherwise 'approved' can quietly come to mean something else."
  - name: "Single use"
    enforces: "consumed once"
    note: "An approval is spent when the stage starts, and is specific to one run and one stage. No blanket approvals."
  - name: "Exclusive claim"
    enforces: "atomic lock"
    note: "Reuses the lab's existing claim tool — an atomic mkdir mutex — so a human working by hand sees the same lock the orchestrator does."
  - name: "Intent record"
    enforces: "written before acting"
    note: "Settled only when the outcome is known. An exception mid-change leaves it unsettled, and an unsettled intent blocks any automatic retry, because the lab may be half-changed."
  - name: "Dry run default"
    enforces: "inert unless told"
    note: "The default walks the whole pipeline and changes nothing. Mutating is a separate, deliberate act — a flag at the terminal, or a button on the dashboard that appears only when an unconsumed approval already matches the stored plan. Neither route can approve anything; both only spend an authorisation that already exists."
  - name: "Fail-closed redaction"
    enforces: "every write and transfer"
    note: "Secrets and internal addressing are stripped before anything is stored, displayed, or handed to another agent. A redaction failure fails the stage rather than passing the text through."
  - name: "Two usage ceilings"
    enforces: "one outside my code"
    note: "The orchestrator caps a run, and the gateway caps it again per project key, so a bug in the first cannot defeat the second. The figure is not money: the CLI agents run on subscriptions with no per-call billing, so the ceiling bounds plan consumption expressed in Claude-equivalent dollars."
  - name: "Load-time validation"
    enforces: "refuses to start"
    note: "A workflow that lets the wrong agent mutate, skips the human gate, or lets the mutator verify its own change is rejected before it runs, not caught halfway through."

# Observability of the agents themselves — separate from `controls` on purpose.
# None of this stops a bad change; it makes a bad run legible afterwards.
observability:
  - name: "Per-run attribution"
    records: "one session per run"
    note: "Every gateway call carries the run id, the agent and the role, so a council run is one tracing session rather than anonymous traffic indistinguishable from the chat UI's."
  - name: "Run scoring"
    records: "five judgements"
    note: "Panel completeness, unsupported claims, deadlock, the operator's decision, and whether the moderator followed its format first time. All were already computed and then discarded; now they can be compared across runs."
  - name: "Failure tracing"
    records: "errors, not just successes"
    note: "The gateway used to report only calls that worked. On a router with fallback chains the failures are the interesting part — a rate limit that triggered a fallback, a key missing a model from its scope."
  - name: "Regression dataset"
    records: "verified ground truth"
    note: "Real review requests whose correct answer was confirmed afterwards by running the command, not by agreeing with a model. Each carries the trap the panel actually fell into."
  - name: "Review interface"
    records: "history, side by side"
    note: "A local web dashboard behind single sign-on showing every run, and each agent's round 1 next to its round 2. The panel's value is the correction between them, which a scrolling transcript hides. It reads persisted state, records an approval, and can spend one — it holds no credential and never invokes an agent itself; a separate unreachable worker does that."
  - name: "Operational overview"
    records: "across runs, not one run"
    note: "Where runs stop, how each agent replied, plan usage per run, and average time per stage. Colour on that page means severity and nothing else — it is read like a log console, so red has to be worth looking at."
  - name: "Activity feed"
    records: "merged from three sources"
    note: "The event log carries only stage transitions. Agent replies and approvals live in their own tables, so a feed built from the event log alone would have shown a quiet lab on a busy day. All three are merged into one severity-coloured stream."
  - name: "Approvals ledger"
    records: "everything that touched the lab"
    note: "Every approval with its scope, actions, plan hash and who recorded it, and every declared execution intent with whether it settled. An intent that never settled means a change may be half-applied, and that is visible without opening the run."
  - name: "Homepage export"
    records: "counts only"
    note: "Separately from the dashboard, run counts go to a file served on an internal listener for the lab's front page. Ids, statuses and totals — never request text, replies or plans."

limits:
  - "One of the three agents needs a human in the loop for every run. That is a deliberate decision after an independent review advised against automating it — not a gap waiting to be closed."
  - "Prompt framing is not a sandbox. An agent with shell access can in principle exceed its brief; the controls above are what actually bite."
  - "The evidence log is tamper-evident, not tamper-proof. Anyone who can write the file can rewrite the chain — it makes a silent edit detectable, not impossible."
  - "The agents review one workflow. This is not a general-purpose assistant."
  - "The usage ceiling watches one seat of three. Only one agent reports a figure at all, so the cap bounds that agent and infers the rest — it is a proxy for a subscription rate limit, not an account balance."
  - "Scoring a run is not judging it. The scores record what the machine observed about its own behaviour; whether the panel was right is still a human reading the transcript."
  - "Agents cannot address each other freely. They answer in rounds and may request a turn; there is no open conversation."
  - "Letting the dashboard execute removed a step of deliberation. Before, mutating meant leaving the browser, opening a shell and typing a flag; now it is a button behind a confirm. That is accepted knowingly: the approval is still the deliberate act \u2014 a separate form naming a scope, an action list and exclusions, bound to a hash of the plan \u2014 and the button only spends one that already exists. The reasoning is written down as an ADR rather than left as a vibe."
  - "The overview\u2019s stage timings are machine time, not elapsed time. A stage that parks for a human is timed from when it resumed, and the timestamps are stored to the second, so anything faster reads as under a second rather than as instant. The page says both, because \u201chuman approval: 1 second\u201d is otherwise a lie told by a true number."
  - "The context pack bounds what an agent is *given*, not what it can *reach*. One spawned agent has already gone outside it to ask a question elsewhere, and the run record showed nothing. Tracked as an open incident rather than described as solved."
