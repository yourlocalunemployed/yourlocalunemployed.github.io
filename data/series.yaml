# Per-series flavour, keyed by the urlized series name (site.Taxonomies.series).
# Read by BOTH layouts/series/taxonomy.html (the /series/ hub) and layouts/list.html
# (the "Tracks" rail on the home page) — keep it as the single source so the two
# never drift apart.
#
#   icon   emoji shown on the series card
#   blurb  full sentence, used on the /series/ hub
#   short  one line for the home-page rail — keep it under ~50 characters
#
# A series with no entry here still renders, with a ◆ placeholder and no blurb.

aaa:
  icon: "🔐"
  blurb: "Authentication, authorization, and accounting across the homelab — a self-hosted vault, then one identity provider with MFA everywhere, from web dashboards to the firewall's own login."
  short: "Vault, single sign-on, MFA everywhere"

apps-with-claude-integration:
  icon: "🧩"
  blurb: "Claude embedded inside the apps themselves rather than driven from a terminal next to them — starting with the note vault where everything else gets written down first."
  short: "Claude inside the app, not beside it"

building-the-blog:
  icon: "📝"
  blurb: "The site itself as a project — a Hugo + Claude Code publishing pipeline, a move to Cloudflare Pages for real security headers, then a hardened domain of its own."
  short: "Hugo, Claude Code, Cloudflare Pages"

built-with-claude:
  icon: "🤖"
  blurb: "Programs built end-to-end by directing Claude Code — from a one-sentence spec to a hardened, packaged tool."
  short: "One-sentence spec to a packaged tool"

# Home Lab was a 24-post catch-all — over half the blog, rendering as "PART 24
# OF 24", which is an archive rather than a series. Split 2026-09-25 into the
# four subjects below, each named after what it is about rather than what it
# runs on. What stayed here is the platform itself: the firewall under it,
# getting back into it, and knowing what is on it.
home-lab:
  icon: "🖥"
  blurb: "Standing the lab up and keeping a way back into it — the firewall rebuild underneath, VPNs and DNS, an inventory of what is really there, and a dashboard over the top."
  short: "The platform, remote access, front door"

watching-the-lab:
  icon: "📈"
  blurb: "Giving the lab a way to say something is wrong — metrics first, then alerts that reach a phone, then the logs behind them. Dashboards you have to remember to check are not monitoring."
  short: "Metrics, then alerts, then logs"

detection-engineering:
  icon: "🔎"
  blurb: "Looking for trouble on purpose — the first vulnerability scan, rules written against the lab's own logs and metrics, and a map of what should be listening checked against what actually answers."
  short: "Scans, rules, and what actually answers"

agents-in-the-lab:
  icon: "🧠"
  blurb: "AI given real access to the infrastructure, and the controls built around it — one gateway for many models, traces of what an agent actually did, hash-chained evidence, and an approval gate it cannot talk its way past."
  short: "Real access, and the controls on it"

keeping-it-running:
  icon: "🔧"
  blurb: "The unglamorous half — a backup proven by restoring it, a watchdog that found five days of silent failure, patching the half apt cannot see, and the week one directory move broke four things."
  short: "Backups, patching, and the day it broke"

hardening-network:
  icon: "🛡"
  blurb: "Locking the network down properly — segmentation, firewall rules and host hardening, every step proven rather than assumed."
  short: "Segmentation, firewall policy, hardening"

spt-mods:
  icon: "🎮"
  blurb: "Reviving abandoned Single Player Tarkov mods — porting them onto modern APIs and hardening them for community release."
  short: "Reviving abandoned Tarkov mods"
