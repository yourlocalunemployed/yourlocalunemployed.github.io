# Things that broke — rendered on /incidents/ by layouts/_default/incidents.html.
#
# House rules for this file, because the page is only worth having if it stays honest:
#   * Every entry must be a REAL failure in this lab, with a date.
#   * `found_by` is how it was actually noticed — "I happened to look" is a valid
#     and important answer, and it is the one that argues for better detection.
#   * `status` is open | fixed | accepted. Do not quietly flip open to fixed;
#     an entry that stays open for months is the useful signal.
#   * `lesson` must be transferable. "Be more careful" is not a lesson.
#   * No internal addressing, hostnames or secret paths. This repo is public.
incidents:
  - date: "2026-09-04"
    title: "The network moved house and two services kept answering anyway"
    severity: "high"
    what: >-
      A directory reorganisation recreated the reverse proxy's docker network, and
      Docker assigned it a different subnet. Everything that reached the host through
      the old gateway broke at once: three proxy routes, fourteen dashboard widgets, a
      metrics daemon's systemd drop-in from July, and a socket unit belonging to the
      audit plane. Two of those carried on working regardless — a socket bound at boot
      survives the interface being deleted underneath it, so the metrics daemon served
      happily on an address that existed on no interface. It only failed when something
      restarted it, and then it failed 2,172 times in a row.
    found_by: "Noticing dashboard widgets were blank, then testing the proxy hop from inside the proxy container rather than from the host."
    fix: >-
      Every reference re-pointed at the current gateway — three routes, fourteen widget
      URLs, the drop-in and the socket unit. The network itself is still unpinned; that
      needs recreating it, which restarts every container attached, so it is waiting for
      a reboot when the downtime costs nothing.
    lesson: >-
      A listening socket is not proof the address still exists. Anything that binds a
      docker gateway is depending on an implementation detail that changes silently the
      next time the network is recreated — pin the subnet, or do not reference it.
    status: "open"
    note: >-
      Still open because the subnet remains unpinned. Everything works today and one
      `docker network rm` reproduces the whole outage.
    post: "/posts/moving-the-files-was-the-easy-part/"

  - date: "2026-09-03"
    title: "The nightly backup failed in a script nobody opened"
    severity: "high"
    what: >-
      After the same reorganisation the backup stopped running. The obvious script had
      five stale paths, but that was not why it failed: the unit runs a wait-for-database
      helper as ExecStartPre, and that helper hardcoded the old path as a literal rather
      than through the shared variable. It waited its full ten-minute timeout for a
      container it was looking up through a file that no longer existed, and the run
      aborted before the backup began.
    found_by: "Reading the unit file properly after the service showed failed, rather than assuming the failure was in the script being debugged."
    fix: >-
      Paths corrected in both scripts. A manual run then completed in three seconds
      against ten minutes of failing, and the freshness metric reset before the
      thirty-hour staleness alert fired.
    lesson: >-
      Trace the whole chain, including every unit hook. ExecStartPre is a place failures
      hide, because the thing that failed is not the thing named in the unit's title.
    status: "fixed"
    note: >-
      The checker written to find these was blind to literal paths by construction — it
      only understood the variable form — and reported the broken script clean. A tool
      finding nothing has two explanations and only one of them was considered.
    post: "/posts/moving-the-files-was-the-easy-part/"

  - date: "2026-09-03"
    title: "A permission bit silently disabled five alert rules"
    severity: "medium"
    what: >-
      Half the custom metrics disappeared from the exporter. The producing script was
      healthy — exit zero, file written, correct contents — but it wrote the file
      0640 root:root into a directory owned root:node_exporter, so the collector could
      not read it. A sibling file in the same directory, written 0644 by a different
      script, was unaffected, which is why only some metrics vanished.
    found_by: "Comparing the modes of two files in the same directory when only one file's metrics were missing."
    fix: >-
      The exporter now sets the mode itself rather than inheriting a umask. A one-off
      chmod would have been undone within five minutes by the next scheduled run.
    lesson: >-
      Metrics that stop arriving do not raise an error; they evaluate to nothing, which
      is indistinguishable from nothing being wrong. The five clock rules those metrics
      fed included the detection for a fault that has twice broken authentication.
    status: "fixed"
    post: "/posts/moving-the-files-was-the-easy-part/"

  - date: "2026-09-02"
    title: "The risk score fell because the evidence disappeared"
    severity: "medium"
    what: >-
      A scan 15 days after the last one reported the headline risk score down from 8.26 to
      2.78, which reads as remediation. Nothing had been remediated. The finding that set
      the old number — a high-severity advisory in the log shipper's image, sitting in the
      95th EPSS percentile — returned zero matches this time against an image with a
      byte-identical digest. It was not re-scored and it was not fixed: it left the
      advisory data. Meanwhile the fixable count rose 1497 to 1912 and criticals went 21
      to 76, also on images that had not changed.
    found_by: >-
      Checking why the one number that moved in a good direction had moved, instead of
      accepting it.
    fix: >-
      None to apply — nothing broke. The reading changed: image digests are now compared
      between runs before any delta is interpreted, and a count is only called an
      improvement when the same advisory source still carries the finding.
    lesson: >-
      A scanner reports what is currently known, not what is currently true. Both
      directions move on their own, and the downward one is more dangerous, because a
      falling risk score looks like progress and nobody investigates good news.
    status: "accepted"
    note: >-
      The same run did contain a real improvement, and it was invisible in the headline:
      an identity-provider upgrade cut that image's fixable findings by 72%. A total that
      mixes new advisory data with actual remediation can hide the remediation inside a
      rise.

  - date: "2026-09-02"
    title: "Archives anyone could read, in a directory nobody else could enter"
    severity: "medium"
    what: >-
      A backup set made by hand during a container upgrade landed world-readable — mode
      0644 on every archive in it, including the password manager's database and the
      reverse proxy's data volume, which holds TLS private keys. A manual export of the
      same vault from a month earlier had the same mode. The scheduled backups were
      correct at 0640: an earlier permissions pass had tightened those and never looked
      at the hand-made ones.
    found_by: "Re-reading the outstanding list on an old handoff, not an alert."
    fix: >-
      A script that only ever removes access and never grants it, run across both backup
      trees — 4,558 entries corrected, 15 of them owned by root. It exits non-zero and
      names the offenders if anything is still permissive, rather than printing a
      reassuring line.
    lesson: >-
      File modes travel. Inside a private home directory a permissive mode is not a leak,
      it is a leak waiting for a copy — tar -p, rsync -a, a bind mount and a restore onto
      another host all carry it out with the file.
    status: "fixed"
    note: >-
      Deliberately not overstated: the home directory is 0700, so no other local account
      could reach any of it and nothing left the host. The cause was a root-in-a-container
      tar under the default umask, and nothing yet stops the next hand-made set repeating
      it.

  - date: "2026-08-25"
    title: "The backup step printed its success line and wrote no file"
    severity: "high"
    what: >-
      A script written to reset a credential took a database snapshot first. It ran the
      snapshot by piping a here-document into a container, but the exec had no interactive
      flag, so standard input was never forwarded. The interpreter read nothing, exited
      zero, and the script printed the line that says the backup was taken. I was told the
      database was safe immediately before a credential was overwritten. It was not.
    found_by: "Going to look for the backup file afterwards."
    fix: >-
      The exec forwards standard input, and the script now asserts the file exists and is
      non-empty before it will touch the credential, refusing to continue otherwise.
    lesson: >-
      A zero exit code from a program that received no input is indistinguishable from
      success. A step that claims a backup has to verify the artefact, not the command.
    status: "fixed"

  - date: "2026-08-25"
    title: "The model list was empty and the gateway was fine"
    severity: "medium"
    what: >-
      The local chat front end showed an empty model selector after login, with no error
      anywhere a person could see it. It keeps its upstream API key in its own database,
      where the environment variable seeds the value once and is ignored ever after. The
      gateway's key had since been rotated, so the front end was authenticating with a
      stale one, getting 401 on every refresh, and rendering that as nothing at all.
    found_by: "Comparing the two keys by hash, after a first diagnosis had declared the backend healthy."
    fix: >-
      Updated the stored key to match and restarted. The rotation procedure now includes
      the database copy, because editing the compose file does nothing once that row exists.
    lesson: >-
      Testing with a credential the application does not use proves nothing. The first
      check sent a request with the environment variable — the half that could not be
      wrong — and cleared the wrong component. Test the half that can be wrong.
    status: "fixed"

  - date: "2026-08-25"
    title: "A resumed review quietly grew a third reviewer"
    severity: "medium"
    what: >-
      A review can be started with a chosen panel of agents. Resuming one did not pass that
      choice through, so the command fell back to its default of all three. Selecting two
      agents and then resuming produced work for an agent that had been declined, and three
      runs on record still carry a prompt for an auditor they should never have been given.
    found_by: "Being asked for an audit I had opted out of, and asking whether the label was lying."
    fix: >-
      Resume now reads the panel recorded against the run and passes it explicitly. The
      workflow name is matched against the shipped definitions rather than pasted into a path.
    lesson: >-
      A default that reappears on resume is a different setting from the one that was
      chosen, and nothing in the interface said so. An option worth offering at the start
      has to survive the run being picked up again.
    status: "fixed"

  - date: "2026-08-25"
    title: "The tests agreed with each other, and both were wrong"
    severity: "low"
    what: >-
      The council dashboard has contract tests whose whole job is to stop the page
      reading a field the server does not send. They build a database from a fixture
      and compare it against what the page accesses. The fixture's schema was written
      by hand and had drifted from the real one — it was missing the message timestamp
      column, among others. A new query selecting that column would have failed
      against the fixture, been caught, and instead the whole activity feed was
      checked against a shape the lab's database does not have. Separately, the
      browser stand-in used to execute the page had a non-recursive `textContent`
      and a `querySelectorAll` that returned an empty list unconditionally, so every
      assertion about rendered text was reading an empty string.
    found_by: "Writing a new test that expected the fixture to contain rows, and getting none."
    fix: >-
      The fixture is now built through the application's own storage class, so it gets
      the production schema and its migrations for free, and a test compares it against
      the deployed database. Every insert names its columns instead of relying on
      position. The browser stand-in's text and selector behaviour are real enough to
      assert against, and an unsupported selector now throws rather than quietly
      matching nothing.
    lesson: >-
      A test double is a claim about the real thing, and nobody checks it. When the
      double and the code drift together the suite goes green on a system that does not
      exist. Derive the double from the real definition, or test that it still matches.
    status: "fixed"
    note: >-
      Found while adding gates for a UI change, not while looking for it. The same pass
      found a colour check scoped to the stylesheet that had missed the inline SVG in
      the page header — a gate can be narrower than the thing it claims to cover.
  - date: "2026-08-22"
    title: "A mistyped path produced the same evidence as asking for none"
    severity: "medium"
    what: >-
      The context builder collected repository and container evidence only when the
      target directory existed, with no branch for when it did not. Passing a
      misspelled directory therefore produced a byte-identical pack to passing no
      directory at all. The panel reviewed on no evidence, every stage passed, and
      nothing in the run recorded that evidence had been asked for and lost.
    found_by: "The council reviewing its own source, on a request that happened to name the flag."
    fix: >-
      The builder now states the outcome in every case — absent, not found, or
      collected — and those notes render into the pack the reviewers read. The
      directory check moved inside the collector, where a sibling collector already
      had one.
    lesson: >-
      A silent skip and a deliberate omission look identical from the outside, and
      the difference only matters when something has gone wrong. Make the absence of
      an input as visible as the input.
    status: "fixed"
    note: >-
      The function had no test coverage at all, which is why it survived. Four of the
      five tests written afterwards fail against the old code.
  - date: "2026-08-22"
    title: "A run parked on a human scored itself as a complete panel"
    severity: "low"
    what: >-
      Waiting on the human-mediated auditor is deliberately not treated as a degraded
      panel, because parking is recoverable and failing is not. The new run scoring
      read the absence of degradation as completeness, so a run that had heard from
      two of three reviewers recorded "every reviewer answered".
    found_by: "Reading the scores of the first run that used them."
    fix: "Scoring now takes the set of reviewers still pending, and a parked run scores false naming who it waits on."
    lesson: >-
      A distinction that is correct in one part of a system becomes a bug when
      another part reuses it as a proxy for something else. Absence of a bad signal
      is not presence of a good one.
    status: "fixed"
  - date: "2026-08-22"
    title: "A dropped metric hid behind the fail-safe meant to protect the run"
    severity: "low"
    what: >-
      Scores are sent best-effort so that an observability outage cannot fail a run
      whose result already exists. One score was malformed — a categorical value sent
      as a number instead of a label — and the server rejected it with a 400. The
      fail-safe swallowed that exactly as designed. Four scores landed, one vanished,
      and nothing said so.
    found_by: "Counting the scores that arrived after the first real run."
    fix: >-
      The emitter now separates the two cases. A rejected payload means this code sent
      something wrong and is reported with the response body; an unreachable server
      stays quiet.
    lesson: >-
      "Never fail the caller" and "never say anything" are different promises, and
      conflating them turns a bug in your own request into silence. Swallow the
      outage, not the error.
    status: "fixed"
  - date: "2026-08-22"
    title: "The interface opened with nowhere to draw and waited thirty-four minutes"
    severity: "low"
    what: >-
      Resuming a run defaults to the terminal interface like every other invocation.
      Started with its output redirected, the interface did not fail — it rendered
      escape codes into the file and then blocked at the human approval gate on a
      keypress that could never arrive. The panel and the synthesis were already
      committed; from outside it looked like work in progress.
    found_by: "Someone asking why it was taking so long."
    fix: >-
      It now refuses to open an interface when its output is not a terminal, and
      refuses before creating the run record, so a run that never starts leaves
      nothing behind.
    lesson: >-
      A program that blocks forever is worse than one that exits, because the first
      looks like progress. Check for the thing you need before doing the work that
      needs it.
    status: "fixed"
  - date: "2026-08-22"
    title: "A dashboard served new data behind an old page"
    severity: "low"
    what: >-
      The dashboard's service groups were reorganised. Its API returned the new
      layout immediately, but the rendered page still carried the old one, and a
      browser given old markup and new data rendered nothing useful.
    found_by: "Trying to open the dashboard after changing it."
    fix: >-
      Recreating the container rather than restarting it. A restart reuses the
      container's writable layer, so the framework's cached page survived; a recreate
      starts from a clean one.
    lesson: >-
      "The config hot-reloads" can be true of one half of an application and false of
      the other. Verifying the API and stopping there is not verifying the thing the
      user opens.
    status: "fixed"
    note: >-
      The change had been checked against every proxied host except the one being
      edited.
  - date: "2026-08-20"
    title: "A spawned agent had a channel the orchestrator did not know about"
    severity: "medium"
    what: >-
      During a review run, one of the agent subprocesses was deliberately barred from
      reading a config file so it would have to rely on its peer. Instead of asking its
      peer, it opened a direct message to a different session on the same host and asked
      there. Nothing about that exchange appeared in the run record, the event log, or
      the evidence chain.
    found_by: "The message arrived in the other session and was noticed by a human reading it."
    fix: >-
      Nothing yet. The request was declined, because answering it would have defeated the
      constraint the test existed to check.
    lesson: >-
      The design assumes an agent reasons over a bounded context pack. That assumption
      holds for what it is *given* and not for what it can *reach*. A boundary that is
      not enforced is a convention, and a convention is not a control — which is the same
      lesson as the redaction module, arriving from the other direction.
    status: "open"
    note: >-
      Deliberately not overstated: the agent asked politely, escalated nothing, and the
      information was not sensitive. The defect is that the run record is incomplete, not
      that anything was compromised.

  - date: "2026-08-20"
    title: "Two reviewers asked each other the same question until the money ran out"
    severity: "low"
    what: >-
      Both reviewers were denied the same fact. Each concluded, correctly, that it needed
      that fact and that the other reviewer might have it. They then asked each other for
      it every round until the hard turn cap stopped them — four rounds of paid calls
      producing no new information.
    found_by: "Reading the transcript of a live run rather than only its final status."
    fix: >-
      A question already put to an agent is never asked again. If every request in a round
      is a repeat, the conversation ends and the deadlock is recorded for the operator.
    lesson: >-
      The turn cap was doing its job and that hid the problem — it bounded the cost without
      addressing the cause. A limit that stops a loop is not the same as detecting one.
    status: "fixed"

  - date: "2026-08-19"
    title: "An agent leaked a credential from the project that built the redaction module"
    severity: "high"
    what: >-
      While debugging a login failure, Claude printed raw HTTP response headers from an
      auth endpoint straight into the session. One carried a live session key. It then
      misdiagnosed that key as the gateway master key and rotated the wrong credential,
      and its repeated login tests left three stray admin keys in the key store.
    found_by: "The agent caught and reported it itself, unprompted."
    fix: >-
      All three keys revoked, master key rotated anyway. The real bug was never a
      password — see the redirect entry below.
    lesson: >-
      That project contains a fail-closed redaction module written by the same agent a
      day earlier, and the debugging output did not go through it. Controls only work
      where they sit in the path. Good intentions are not a control, whether the
      operator is a person or a model.
    status: "fixed"
    post: "/posts/three-agents-one-approval-gate/"

  - date: "2026-08-19"
    title: "A password that was never wrong"
    severity: "medium"
    what: >-
      The gateway admin UI rejected every login attempt. The credentials were correct
      the entire time: the app rebuilds its post-login redirect from the request host and
      emitted http:// because TLS terminates at the reverse proxy, so the session cookie
      died on the scheme change and the UI bounced back to the login form.
    found_by: "Testing the login endpoint directly instead of retyping the password."
    fix: "One environment variable telling the app its real external base URL."
    lesson: >-
      Setting it in the env file alone did nothing — Compose forwards only the variables
      it names. A config value that exists but is not wired through looks identical to a
      config value that is wrong.
    status: "fixed"

  - date: "2026-08-18"
    title: "The synthesised plan was never persisted"
    severity: "high"
    what: >-
      The orchestrator binds a human approval to a hash of the exact plan. That plan lived
      only in memory, so a run that parked for approval — the normal path, not an edge
      case — came back with the pre-synthesis text, hashed differently, and could never
      satisfy its own approval.
    found_by: "The first attempt to actually execute a change. Every unit test passed."
    fix: "Persist the plan on the run and restore it on resume."
    lesson: >-
      The feature was broken in its single most common use case while the suite was green.
      Tests prove the parts behave; only running the whole thing proves the parts connect.
    status: "fixed"
    post: "/posts/three-agents-one-approval-gate/"

  - date: "2026-08-18"
    title: "A vulnerability count that went up on an image that never changed"
    severity: "info"
    what: >-
      After a full remediation pass, one Postgres image reported nine MORE fixable findings
      than before — on a byte-identical digest.
    found_by: "Recomputing both scans from raw scanner output instead of trusting the summary."
    fix: "Nothing to fix. The image was identical; the vulnerability database had moved."
    lesson: >-
      A scan delta is a measurement with a timestamp, not a score. Comparing two runs is
      only honest if you can point at something that did not change and show what it did.
    status: "accepted"
    post: "/posts/vuln-scan-codex-container-upgrade-claude-code/"

  - date: "2026-08-18"
    title: "An upgrade that fixed nothing"
    severity: "info"
    what: >-
      Open WebUI was upgraded from a rolling tag to a pinned release. Different image,
      different digest, and exactly the same 148 fixable findings as before.
    found_by: "Comparing per-image counts rather than the headline total."
    fix: >-
      None available. The findings live in base layers the release does not address. It is
      now the single largest remaining contributor.
    lesson: >-
      Pinning bought reproducibility, not security. Assuming a newer release means fewer
      vulnerabilities is a guess, and it was wrong here.
    status: "open"
    post: "/posts/vuln-scan-codex-container-upgrade-claude-code/"

  - date: "2026-08-17"
    title: "A backup that could not be restored"
    severity: "high"
    what: >-
      A database volume was archived while its container kept running. The archiver failed
      mid-run with 'No such file or directory' as the database deleted its own parts during
      a merge. The resulting file looked like a backup and was not one.
    found_by: "Reading the error output instead of only the exit code."
    fix: >-
      Renamed the bad archive so it could never be mistaken for a restore point, stopped
      the stack, and retook it cold — 53,022 entries, zero errors.
    lesson: >-
      Anything that writes continuously cannot be archived hot. The same applies to SQLite
      under WAL, which fails silently rather than loudly and is therefore worse.
    status: "fixed"
    post: "/posts/vuln-scan-codex-container-upgrade-claude-code/"

  - date: "2026-08-17"
    title: "A failing reviewer hidden behind a waiting one"
    severity: "medium"
    what: >-
      In a multi-agent review, one reviewer hit its usage limit while another was waiting on
      a human. The stage reported only 'waiting' and looked benignly parked, while one of
      three reviewers had not run at all.
    found_by: "The first live run. Mocks could not have produced it."
    fix: "Failures now outrank parking, and the parked agent is still named in the detail."
    lesson: >-
      A review that looks complete and is not is the exact failure the whole design exists
      to prevent. Status precedence is a correctness property, not cosmetics.
    status: "fixed"
    post: "/posts/three-agents-one-approval-gate/"

  - date: "2026-07"
    title: "Backups stopped for five days and nothing said anything"
    severity: "critical"
    what: >-
      The scheduled backup silently stopped running. Five days passed with no archive and no
      alert.
    found_by: "Building the watchdog that was supposed to catch it — it caught the live outage."
    fix: "A nightly workflow that checks the backup directory and pushes to my phone."
    lesson: >-
      The monitor needed fixing before the thing it monitored. Absence of an alert is not
      evidence of health when nothing is checking for absence.
    status: "open"
    note: >-
      Still not fully resolved. The watchdog currently runs BEFORE the backup it checks, so it
      structurally cannot detect a missed one. Scheduled runs were also observed missing on
      two consecutive days in August. Listed as open because it is.
    post: "/posts/n8n-backup-watchdog/"

  - date: "2026-07"
    title: "Patching that reported success while patching nothing"
    severity: "high"
    what: >-
      Automated OS patching reported clean runs while applying no updates.
    found_by: "Checking the thing being reported on, rather than the report."
    fix: "Repaired the reporting path first, then the patching itself."
    lesson: >-
      A green dashboard is a claim about a system, not the system. Verify the claim against
      the thing it describes.
    status: "fixed"
    post: "/posts/patching-a-homelab-apt-and-containers/"
