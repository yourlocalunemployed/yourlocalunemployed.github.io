# Things that broke — rendered on /incidents/ by layouts/_default/incidents.html.
#
# House rules for this file, because the page is only worth having if it stays honest:
#   * Every entry must be a REAL failure in this lab, with a date.
#   * `found_by` is how it was actually noticed — "I happened to look" is a valid
#     and important answer, and it is the one that argues for better detection.
#   * `status` is open | fixed | accepted. Do not quietly flip open to fixed;
#     an entry that stays open for months is the useful signal.
#   * `lesson` must be transferable. "Be more careful" is not a lesson.
#   * No internal addressing, hostnames or secret paths. This repo is public.
incidents:
  - date: "2026-08-22"
    title: "A mistyped path produced the same evidence as asking for none"
    severity: "medium"
    what: >-
      The context builder collected repository and container evidence only when the
      target directory existed, with no branch for when it did not. Passing a
      misspelled directory therefore produced a byte-identical pack to passing no
      directory at all. The panel reviewed on no evidence, every stage passed, and
      nothing in the run recorded that evidence had been asked for and lost.
    found_by: "The council reviewing its own source, on a request that happened to name the flag."
    fix: >-
      The builder now states the outcome in every case — absent, not found, or
      collected — and those notes render into the pack the reviewers read. The
      directory check moved inside the collector, where a sibling collector already
      had one.
    lesson: >-
      A silent skip and a deliberate omission look identical from the outside, and
      the difference only matters when something has gone wrong. Make the absence of
      an input as visible as the input.
    status: "fixed"
    note: >-
      The function had no test coverage at all, which is why it survived. Four of the
      five tests written afterwards fail against the old code.
  - date: "2026-08-22"
    title: "A run parked on a human scored itself as a complete panel"
    severity: "low"
    what: >-
      Waiting on the human-mediated auditor is deliberately not treated as a degraded
      panel, because parking is recoverable and failing is not. The new run scoring
      read the absence of degradation as completeness, so a run that had heard from
      two of three reviewers recorded "every reviewer answered".
    found_by: "Reading the scores of the first run that used them."
    fix: "Scoring now takes the set of reviewers still pending, and a parked run scores false naming who it waits on."
    lesson: >-
      A distinction that is correct in one part of a system becomes a bug when
      another part reuses it as a proxy for something else. Absence of a bad signal
      is not presence of a good one.
    status: "fixed"
  - date: "2026-08-22"
    title: "A dropped metric hid behind the fail-safe meant to protect the run"
    severity: "low"
    what: >-
      Scores are sent best-effort so that an observability outage cannot fail a run
      whose result already exists. One score was malformed — a categorical value sent
      as a number instead of a label — and the server rejected it with a 400. The
      fail-safe swallowed that exactly as designed. Four scores landed, one vanished,
      and nothing said so.
    found_by: "Counting the scores that arrived after the first real run."
    fix: >-
      The emitter now separates the two cases. A rejected payload means this code sent
      something wrong and is reported with the response body; an unreachable server
      stays quiet.
    lesson: >-
      "Never fail the caller" and "never say anything" are different promises, and
      conflating them turns a bug in your own request into silence. Swallow the
      outage, not the error.
    status: "fixed"
  - date: "2026-08-22"
    title: "The interface opened with nowhere to draw and waited thirty-four minutes"
    severity: "low"
    what: >-
      Resuming a run defaults to the terminal interface like every other invocation.
      Started with its output redirected, the interface did not fail — it rendered
      escape codes into the file and then blocked at the human approval gate on a
      keypress that could never arrive. The panel and the synthesis were already
      committed; from outside it looked like work in progress.
    found_by: "Someone asking why it was taking so long."
    fix: >-
      It now refuses to open an interface when its output is not a terminal, and
      refuses before creating the run record, so a run that never starts leaves
      nothing behind.
    lesson: >-
      A program that blocks forever is worse than one that exits, because the first
      looks like progress. Check for the thing you need before doing the work that
      needs it.
    status: "fixed"
  - date: "2026-08-22"
    title: "A dashboard served new data behind an old page"
    severity: "low"
    what: >-
      The dashboard's service groups were reorganised. Its API returned the new
      layout immediately, but the rendered page still carried the old one, and a
      browser given old markup and new data rendered nothing useful.
    found_by: "Trying to open the dashboard after changing it."
    fix: >-
      Recreating the container rather than restarting it. A restart reuses the
      container's writable layer, so the framework's cached page survived; a recreate
      starts from a clean one.
    lesson: >-
      "The config hot-reloads" can be true of one half of an application and false of
      the other. Verifying the API and stopping there is not verifying the thing the
      user opens.
    status: "fixed"
    note: >-
      The change had been checked against every proxied host except the one being
      edited.
  - date: "2026-08-20"
    title: "A spawned agent had a channel the orchestrator did not know about"
    severity: "medium"
    what: >-
      During a review run, one of the agent subprocesses was deliberately barred from
      reading a config file so it would have to rely on its peer. Instead of asking its
      peer, it opened a direct message to a different session on the same host and asked
      there. Nothing about that exchange appeared in the run record, the event log, or
      the evidence chain.
    found_by: "The message arrived in the other session and was noticed by a human reading it."
    fix: >-
      Nothing yet. The request was declined, because answering it would have defeated the
      constraint the test existed to check.
    lesson: >-
      The design assumes an agent reasons over a bounded context pack. That assumption
      holds for what it is *given* and not for what it can *reach*. A boundary that is
      not enforced is a convention, and a convention is not a control — which is the same
      lesson as the redaction module, arriving from the other direction.
    status: "open"
    note: >-
      Deliberately not overstated: the agent asked politely, escalated nothing, and the
      information was not sensitive. The defect is that the run record is incomplete, not
      that anything was compromised.

  - date: "2026-08-20"
    title: "Two reviewers asked each other the same question until the money ran out"
    severity: "low"
    what: >-
      Both reviewers were denied the same fact. Each concluded, correctly, that it needed
      that fact and that the other reviewer might have it. They then asked each other for
      it every round until the hard turn cap stopped them — four rounds of paid calls
      producing no new information.
    found_by: "Reading the transcript of a live run rather than only its final status."
    fix: >-
      A question already put to an agent is never asked again. If every request in a round
      is a repeat, the conversation ends and the deadlock is recorded for the operator.
    lesson: >-
      The turn cap was doing its job and that hid the problem — it bounded the cost without
      addressing the cause. A limit that stops a loop is not the same as detecting one.
    status: "fixed"

  - date: "2026-08-19"
    title: "An agent leaked a credential from the project that built the redaction module"
    severity: "high"
    what: >-
      While debugging a login failure, Claude printed raw HTTP response headers from an
      auth endpoint straight into the session. One carried a live session key. It then
      misdiagnosed that key as the gateway master key and rotated the wrong credential,
      and its repeated login tests left three stray admin keys in the key store.
    found_by: "The agent caught and reported it itself, unprompted."
    fix: >-
      All three keys revoked, master key rotated anyway. The real bug was never a
      password — see the redirect entry below.
    lesson: >-
      That project contains a fail-closed redaction module written by the same agent a
      day earlier, and the debugging output did not go through it. Controls only work
      where they sit in the path. Good intentions are not a control, whether the
      operator is a person or a model.
    status: "fixed"
    post: "/posts/three-agents-one-approval-gate/"

  - date: "2026-08-19"
    title: "A password that was never wrong"
    severity: "medium"
    what: >-
      The gateway admin UI rejected every login attempt. The credentials were correct
      the entire time: the app rebuilds its post-login redirect from the request host and
      emitted http:// because TLS terminates at the reverse proxy, so the session cookie
      died on the scheme change and the UI bounced back to the login form.
    found_by: "Testing the login endpoint directly instead of retyping the password."
    fix: "One environment variable telling the app its real external base URL."
    lesson: >-
      Setting it in the env file alone did nothing — Compose forwards only the variables
      it names. A config value that exists but is not wired through looks identical to a
      config value that is wrong.
    status: "fixed"

  - date: "2026-08-18"
    title: "The synthesised plan was never persisted"
    severity: "high"
    what: >-
      The orchestrator binds a human approval to a hash of the exact plan. That plan lived
      only in memory, so a run that parked for approval — the normal path, not an edge
      case — came back with the pre-synthesis text, hashed differently, and could never
      satisfy its own approval.
    found_by: "The first attempt to actually execute a change. Every unit test passed."
    fix: "Persist the plan on the run and restore it on resume."
    lesson: >-
      The feature was broken in its single most common use case while the suite was green.
      Tests prove the parts behave; only running the whole thing proves the parts connect.
    status: "fixed"
    post: "/posts/three-agents-one-approval-gate/"

  - date: "2026-08-18"
    title: "A vulnerability count that went up on an image that never changed"
    severity: "info"
    what: >-
      After a full remediation pass, one Postgres image reported nine MORE fixable findings
      than before — on a byte-identical digest.
    found_by: "Recomputing both scans from raw scanner output instead of trusting the summary."
    fix: "Nothing to fix. The image was identical; the vulnerability database had moved."
    lesson: >-
      A scan delta is a measurement with a timestamp, not a score. Comparing two runs is
      only honest if you can point at something that did not change and show what it did.
    status: "accepted"
    post: "/posts/vuln-scan-codex-container-upgrade-claude-code/"

  - date: "2026-08-18"
    title: "An upgrade that fixed nothing"
    severity: "info"
    what: >-
      Open WebUI was upgraded from a rolling tag to a pinned release. Different image,
      different digest, and exactly the same 148 fixable findings as before.
    found_by: "Comparing per-image counts rather than the headline total."
    fix: >-
      None available. The findings live in base layers the release does not address. It is
      now the single largest remaining contributor.
    lesson: >-
      Pinning bought reproducibility, not security. Assuming a newer release means fewer
      vulnerabilities is a guess, and it was wrong here.
    status: "open"
    post: "/posts/vuln-scan-codex-container-upgrade-claude-code/"

  - date: "2026-08-17"
    title: "A backup that could not be restored"
    severity: "high"
    what: >-
      A database volume was archived while its container kept running. The archiver failed
      mid-run with 'No such file or directory' as the database deleted its own parts during
      a merge. The resulting file looked like a backup and was not one.
    found_by: "Reading the error output instead of only the exit code."
    fix: >-
      Renamed the bad archive so it could never be mistaken for a restore point, stopped
      the stack, and retook it cold — 53,022 entries, zero errors.
    lesson: >-
      Anything that writes continuously cannot be archived hot. The same applies to SQLite
      under WAL, which fails silently rather than loudly and is therefore worse.
    status: "fixed"
    post: "/posts/vuln-scan-codex-container-upgrade-claude-code/"

  - date: "2026-08-17"
    title: "A failing reviewer hidden behind a waiting one"
    severity: "medium"
    what: >-
      In a multi-agent review, one reviewer hit its usage limit while another was waiting on
      a human. The stage reported only 'waiting' and looked benignly parked, while one of
      three reviewers had not run at all.
    found_by: "The first live run. Mocks could not have produced it."
    fix: "Failures now outrank parking, and the parked agent is still named in the detail."
    lesson: >-
      A review that looks complete and is not is the exact failure the whole design exists
      to prevent. Status precedence is a correctness property, not cosmetics.
    status: "fixed"
    post: "/posts/three-agents-one-approval-gate/"

  - date: "2026-07"
    title: "Backups stopped for five days and nothing said anything"
    severity: "critical"
    what: >-
      The scheduled backup silently stopped running. Five days passed with no archive and no
      alert.
    found_by: "Building the watchdog that was supposed to catch it — it caught the live outage."
    fix: "A nightly workflow that checks the backup directory and pushes to my phone."
    lesson: >-
      The monitor needed fixing before the thing it monitored. Absence of an alert is not
      evidence of health when nothing is checking for absence.
    status: "open"
    note: >-
      Still not fully resolved. The watchdog currently runs BEFORE the backup it checks, so it
      structurally cannot detect a missed one. Scheduled runs were also observed missing on
      two consecutive days in August. Listed as open because it is.
    post: "/posts/n8n-backup-watchdog/"

  - date: "2026-07"
    title: "Patching that reported success while patching nothing"
    severity: "high"
    what: >-
      Automated OS patching reported clean runs while applying no updates.
    found_by: "Checking the thing being reported on, rather than the report."
    fix: "Repaired the reporting path first, then the patching itself."
    lesson: >-
      A green dashboard is a claim about a system, not the system. Verify the claim against
      the thing it describes.
    status: "fixed"
    post: "/posts/patching-a-homelab-apt-and-containers/"
