# Home-lab component inventory — rendered on /lab/ by layouts/_default/lab.html.
# Every component links to the post where it was built ("each box has a write-up").
# Keep in sync as the lab grows. Network detail here must stay within what the
# posts already publish (10.10.0.0/24, VLANs 10/20/30) — no domains, tailnet
# names, public IPs, or home-LAN specifics.

# Headline figures (kept honest — each is defensible from a published post).
# `label` is the full wording used on /lab/, where each figure sits under a large
# numeral with room to breathe. `short` is an optional trim for the home-page
# posture strip, which runs all five inline on one band — the full labels come to
# ~180 characters there and turn into a paragraph on a phone. Same convention as
# `short`/`blurb` in series.yaml; the strip falls back to `label` when `short` is
# absent, so a new figure needs no extra work. A `short` must stay defensible
# against the same published post its `label` is — trim wording, never widen the
# claim.
numbers:
  - value: "1"
    label: "inbound port — WireGuard only, all else closed"
    short: "inbound port"
  - value: "MFA"
    label: "on every login, enforced centrally"
    short: "on every login"
  - value: "3"
    label: "firewall-isolated VLANs"
    short: "isolated VLANs"
  # This figure must equal the number of component boxes rendered by the `layers:` block
  # below — the page shows them, so anyone can count. Recheck it whenever a component is
  # added or removed; `grep -c '^        post:' data/lab.yaml` is the count.
  #
  # 20 as of 2026-08-14 — NetBox added, then Langfuse, which had a published post since
  # 2026-07 but had never been listed here at all.
  #
  # It read 17 from 2026-08-08 to 2026-08-14 while the inventory rendered 18: that drop
  # was made for Greenbone/OpenVAS losing its write-up
  # when it was replaced by Grype + Trivy, but Greenbone was never a row in `layers`, so
  # the figure moved and the inventory didn't. Grype/Trivy still has no post and still is
  # not counted; it appears only as a diagram chip, which describes what the lab runs
  # rather than what it has published.
  - value: "20"
    label: "components, each with a write-up"
    short: "documented components"
  - value: "7"
    label: "telemetry & egress flows"

# Operational posture — deliberately honest about what this is and isn't.
posture:
  - aspect: "Environment"
    state: "Virtual"
    note: "VMware VMs on a single workstation (my main PC) — a learning and build environment, not dedicated always-on hardware."
  - aspect: "Availability"
    state: "While in use"
    note: "Powered up when I'm working and shut down nightly. Monitoring, alerting and log detection run during uptime — not 24/7 yet."
  - aspect: "Backups"
    state: "Two layers · restore-tested"
    note: "Off-site disaster recovery: consistent DB snapshots (pg_dump / SQLite .backup), age-encrypted, pushed off the host — and restored into a throwaway container to prove they work. Local full VM clones sit alongside for fast rollback (same host, so not DR on their own)."
  - aspect: "Recovery"
    state: "Returns on boot"
    note: "Every service is restart:unless-stopped or systemd-enabled, so the stack comes back on its own once the machine powers on."
  - aspect: "Secrets"
    state: "Encrypted off-box"
    note: "age public-key encryption; the private key is deliberately kept off the cloud storage that holds the backups."
  - aspect: "Change control"
    state: "Two agents, split roles"
    note: "Claude Code makes the changes, under root-managed hooks that log every tool call to a hash-chained ledger. Kimi Code runs separately as a read-only auditor: it reports findings and ranks them, but is not allowed to remediate, and its launcher refuses to start if a policy file's checksum has changed. Neither one approves its own work — that stays with me."
  - aspect: "Next step"
    state: "Always-on host"
    note: "Moving the load-bearing services onto dedicated hardware, so identity, firewall and detection stop depending on a VM that sleeps."

# The physical host, and how much of it the lab actually gets.
#
# `chips` mirrors layouts/_partials/pc_specs.html (the home-page sidebar) — keep the
# two in step, that partial is the source for the build itself. `alloc` is the guest
# side, read off the Debian VM (`nproc`, `free -h`, `df -h /`), so it is a measured
# figure and not a plan: re-read it if the VM is resized. `pct` is only the bar fill
# and must match `detail`.
hardware:
  chips:
    - key: "CPU"
      value: "Ryzen 7 7800X3D"
      note: "8 cores · 16 threads"
    - key: "GPU"
      value: "PNY RTX 4090"
      note: "24 GB VRAM"
    - key: "Memory"
      value: "64 GB DDR5"
      note: "6000 MHz"
    - key: "Storage"
      value: "1 TB NVMe"
      note: "+ 2 TB HDD"
    - key: "Hypervisor"
      value: "VMware Workstation Pro"
      note: "17.6.4"
    - key: "Cooling"
      value: "360 mm AIO"
      note: "10 fans · Lian Li EVO 11"
  alloc:
    - resource: "vCPU"
      pct: 50
      detail: "8 of 16 threads"
    - resource: "Memory"
      pct: 41
      detail: "26 of 64 GB"
    - resource: "Disk"
      pct: 22
      detail: "333 GB virtual disk · 74 GB used"

# The lab as defence-in-depth layers. Each layer groups its components.
layers:
  - name: "Boundary & network"
    icon: "🛡"
    blurb: "A firewall VM is the only thing the rest of the lab talks to the world through — default-deny, private ranges blocked outbound, segmented into isolated zones."
    components:
      - icon: "🛡"
        name: "pfSense firewall"
        runs: "Dedicated VM · WAN + LAN 10.10.0.0/24"
        secured: "Default-deny rules; MFA admin login"
        post: "/posts/pfsense-lab-recovery-and-hardening/"
      - icon: "🕸"
        name: "VLAN segmentation"
        runs: "VLANs 10 / 20 / 30 — Trusted, IoT, Guest"
        secured: "Inter-VLAN traffic firewalled by default"
        post: "/posts/vlan-segmentation-pfsense/"
      - icon: "🔐"
        name: "WireGuard VPN"
        runs: "On pfSense, reached from mobile data"
        secured: "Key-based, through the nested firewall"
        post: "/posts/wireguard-pfsense-nested-firewall/"
      - icon: "🧿"
        name: "AdGuard Home"
        runs: "Docker on the Debian VM — DNS sinkhole for host + phone"
        secured: "Bound to lab + tailnet IPs only; admin UI via Authentik SSO"
        post: "/posts/adguard-dns-filter-homelab/"

  - name: "Identity & access"
    icon: "🪪"
    blurb: "One identity provider with MFA is the single login authority — for web dashboards and for the firewall's own admin login. Who you are and what you may do are decided in one place."
    components:
      - icon: "🔐"
        name: "Authentik IdP"
        runs: "Docker on the Debian VM"
        secured: "MFA enforced centrally, group-based roles"
        post: "/posts/identity-provider-authentik-grafana-sso/"
      - icon: "🪪"
        name: "pfSense ↔ Authentik LDAP"
        runs: "Firewall auth against the IdP"
        secured: "MFA + group admin on a device with no browser"
        post: "/posts/pfsense-authentik-ldap-radius/"
      - icon: "🔑"
        name: "Vaultwarden"
        runs: "Docker + Caddy, wildcard TLS via DNS-01"
        secured: "Zero inbound ports; reached over WireGuard"
        post: "/posts/self-hosted-vaultwarden-caddy-duckdns/"

  - name: "Compute & automation"
    icon: "🖥"
    blurb: "One hardened Debian VM hosts the containers and the agent workflow. It runs the services above and the monitoring below, and it's locked down as its own audited surface."
    components:
      - icon: "🖥"
        name: "Debian VM"
        runs: "VMware host for Docker + native services"
        secured: "Auto-updates, nftables, Tailscale-only SSH, sandboxing"
        post: "/posts/hardening-debian-homelab-vm/"
      - icon: "🔗"
        name: "MCP hub"
        runs: "Custom server on the VM, over Tailscale"
        secured: "No inbound ports, narrow tool surface"
        post: "/posts/claude-code-mcp-hub-tailscale/"
      - icon: "📝"
        name: "Claude Code pipeline"
        runs: "Drives the blog + lab work from the VM"
        secured: "Deterministic hooks gate posts, builds, commands"
        post: "/posts/self-hosted-hugo-claude-code-pipeline/"
      - icon: "🚪"
        name: "AI gateway"
        runs: "LiteLLM + Open WebUI, Docker on the VM"
        secured: "SSO for the UI, API keys for agents; no inbound ports"
        post: "/posts/self-hosted-multi-llm-gateway-homelab/"
      - icon: "🗂"
        name: "NetBox"
        runs: "DCIM + IPAM, Docker on the VM"
        secured: "SSO in front, its own app login behind; resource-capped"
        post: "/posts/netbox-homelab-trial/"

  - name: "Observability & detection"
    icon: "📈"
    blurb: "Metrics answer 'what's the number', logs answer 'what happened', and alerts reach out so nothing waits to be noticed. Dashboards, alerting, and a log SIEM on one stack."
    components:
      - icon: "📈"
        name: "Prometheus"
        runs: "Native systemd, localhost-bound :9090"
        secured: "Scrapes the VM + pfSense, no external exposure"
        post: "/posts/prometheus-grafana-observability-stack/"
      - icon: "📊"
        name: "Grafana"
        runs: "Dashboards over the metric + log stores"
        secured: "SSO via OIDC, admin by group membership"
        post: "/posts/identity-provider-authentik-grafana-sso/"
      - icon: "🔔"
        name: "Alertmanager → ntfy"
        runs: "Docker :9093 → phone push"
        secured: "Metric + log alerts, formatted, loopback-bound"
        post: "/posts/metrics-arent-monitoring/"
      - icon: "🪵"
        name: "Loki SIEM"
        runs: "Loki + Promtail + rsyslog, in Docker"
        secured: "pfSense/auth/syslog centralised, LogQL detection"
        post: "/posts/homelab-siem-loki/"
      - icon: "🔬"
        name: "Langfuse"
        runs: "Traces every Claude Code session, Docker on the VM"
        secured: "Own app login behind Caddy; web container publishes no host port"
        post: "/posts/implementing-langfuse-to-monitor-claude-code/"
      - icon: "🛡"
        name: "Agent assurance plane"
        runs: "Own systemd service + user, loopback only — audits the Claude Code agent"
        secured: "Root-managed hooks, hash-chained ledger, reduced feed to Loki; observe-only"
        post: "/posts/auditing-the-ai-agent-that-runs-my-homelab/"

  - name: "Resilience & edge"
    icon: "💾"
    blurb: "The parts that decide whether the lab survives a bad day: encrypted off-site backups that have actually been restored, and a physical glance display that never crosses the isolation boundary."
    components:
      - icon: "💾"
        name: "Encrypted backups"
        runs: "Bash + cron → age → OneDrive"
        secured: "pg_dump/.backup for consistency, restore-tested"
        post: "/posts/backup-you-havent-restored/"
      - icon: "⏱"
        name: "LaMetric display"
        runs: "Physical desk display, live lab stats"
        secured: "Over MQTT + SNMP outbound — no LAN crossover"
        post: "/posts/implementing-lametric-time-to-network/"
